    <script data-marimo="true">
      function __resizeIframe(obj) {
        const scrollbarHeight = 20; // Max between windows, mac, and linux

        function setHeight() {
          // Guard against race condition where iframe isn't ready
          if (!obj.contentWindow?.document?.documentElement) {
            return;
          }
          const element = obj.contentWindow.document.documentElement;
          // If there is no vertical scrollbar, we don't need to resize the iframe
          if (element.scrollHeight === element.clientHeight) {
            return;
          }

          // Create a new height that includes the scrollbar height if it's visible
          const hasHorizontalScrollbar = element.scrollWidth > element.clientWidth;
          const newHeight = element.scrollHeight + (hasHorizontalScrollbar ? scrollbarHeight : 0);

          // Only update the height if it's different from the current height
          if (obj.style.height !== `${newHeight}px`) {
            obj.style.height = `${newHeight}px`;
          }
        }

        // Resize the iframe to the height of the content and bottom scrollbar height
        setHeight();

        // Resize the iframe when the content changes
        const resizeObserver = new ResizeObserver((_entries) => {
          setHeight();
        });
        // Only observe if iframe content is ready
        if (obj.contentWindow?.document?.body) {
          resizeObserver.observe(obj.contentWindow.document.body);
        }
      }
    </script>

t: space-between;align-items: normal;flex-wrap: nowrap;gap: 0.5rem'\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003E\u003Ca href=\"https://vflins.github.io/mini_projects/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003E\u003Cimg alt=\"Ver outros projetos\" src=\"https://img.shields.io/badge/ver%20outros%20projetos-white.svg?style=for-the-badge\u0026amp;logo=data:image/svg%2bxml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA0OCA0OCIgaGVpZ2h0PSI0OHB4IiB3aWR0aD0iNDhweCIgZmlsbD0iIzIxMmMzOCI+PHBhdGggZD0iTTIxLjIsNDUuMkwwLDI0TDIxLjIsMi44bDQsNC4wNUw4LjA1LDI0TDI1LjIsNDEuMTVsLTQsNC4wNVoiLz48L3N2Zz4=\" /\u003E\u003C/a\u003E\u003C/span\u003E\u003C/span\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003E\u003Ca href=\"https://github.com/VFLins/mini_projects/tree/main/eleicoes2026\" rel=\"noopener noreferrer\" target=\"_blank\"\u003E\u003Cimg alt=\"Reposit\u00f3rio\" src=\"https://img.shields.io/badge/Reposit%C3%B3rio-white?logo=github\u0026amp;logoColor=212c38\u0026amp;style=for-the-badge\" /\u003E\u003C/a\u003E\u003C/span\u003E\u003C/span\u003E\u003C/div\u003E"}, "type": "data"}]}, {"code_hash": "12bbd5f81d95f0900975776b2a49afde", "console": [], "id": "RGSE", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch1 id=\"entendendo-a-transferencia-de-votos-nas-eleicoes-presidenciais-de-2026\"\u003EEntendendo a transfer\u00eancia de votos nas elei\u00e7\u00f5es presidenciais de 2026\u003C/h1\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "4ddbe17c202d9ba1284d43b93a9c63bf", "console": [], "id": "Kclp", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003E\u003Cspan style='font-family: space mono, monospace; font-size: 13px; text-transform: uppercase'\u003E\u003Cb\u003E\n    segunda-feira, 23 de novembro de 2026\u003C/b\u003E | 18 minutos de leitura\u003C/span\u003E\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "1f582d67e78df1de07982fef5bc1f064", "console": [], "id": "emfo", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Chr /\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003C/br\u003E\u003C/span\u003E\n\u003Cdiv class=\"admonition note\"\u003E\n\u003Cspan class=\"admonition-title\"\u003EResumo\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EAs elei\u00e7\u00f5es presidenciais de 2026 sofreram com uma quantidade de acusa\u00e7\u00f5es de fraude e por causa do resultado inesperado para muitos depois das vota\u00e7\u00f5es. Esta an\u00e1lise tenta entender se o fluxo de votos entre turnos que vimos \u00e9 poss\u00edvel e o que explicaria ele, para isso, usamos um modelo de infer\u00eancia nos dados oficiais da vota\u00e7\u00e3o, e complementamos a an\u00e1lise dos resultados deste modelo com uma an\u00e1lise explorat\u00f3ria em dados das pesquisas eleitorais e fatos divulgados pela imprensa.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EOs resultados mostram que a diferen\u00e7a de estrat\u00e9gia entre as campanhas eleitorais no segundo turno definiram o resultado no segundo turno. Enquanto a campanha de Fl\u00e1vio Bolsonaro diminuiu esfor\u00e7os com a perspectiva de vit\u00f3ria certa, a capanha de Lula se intensificou, conseguindo votos suficientes para empatar a disputa ao atrair eleitores que votaram no primeiro turno, e somando-se a estes, suficientes para virar a vota\u00e7\u00e3o ao atrair eleitores que se abstiveram no primeiro turno.\u003C/span\u003E\n\u003C/div\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cbr/ \u003E\u003C/span\u003E\n\u003Ch2 id=\"introducao\"\u003EIntrodu\u00e7\u00e3o\u003C/h2\u003E\n\u003Cspan class=\"paragraph\"\u003EO candidato Fl\u00e1vio Bolsonaro terminou o primeiro turno com uma vota\u00e7\u00e3o maior que a do seu advers\u00e1rio Lula, isto levou os bolsonaristas a acreditar que a vit\u00f3ria no segundo turno seria certa, j\u00e1 que historicamente, o primeiro colocado no primeiro turno sempre acabava ganhando a disputa no segundo turno.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EDepois da derrota, j\u00e1 nos Estados Unidos, Fl\u00e1vio Bolsonaro alegou uma \"impossibilidade matem\u00e1tica\", que permitiu que o seu advers\u00e1rio Lula ganhasse mais de 10 Milh\u00f5es de votos do primeiro para o segundo turno. Al\u00e9m disso, se aponta que a maioria das pesquisas de inten\u00e7\u00f5es de voto indicava a vit\u00f3ria iminente do candidato.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EO objetivo desta an\u00e1lise \u00e9 combinar os dados de vota\u00e7\u00e3o com os resultados de pesquisas de opini\u00e3o anteriores \u00e0s vota\u00e7\u00f5es do segundo turno para entender se esta transfer\u00eancia \u00e9 realmente imposs\u00edvel como alegado. Para isso, vamos separar esta an\u00e1lise em partes:\u003C/span\u003E\n\u003Col\u003E\n\u003Cli\u003EEstimar a transfer\u00eancia poss\u00edvel de votos com dados oficiais das vota\u00e7\u00f5es, e comparar com fatos das estrat\u00e9gias de campanha para entender se este ganho de votos foi realmente poss\u00edvel; depois vamos\u003C/li\u003E\n\u003Cli\u003ETentar entender se mesmo com a discrep\u00e2ncia entre as pesquisas eleitorais realizadas ap\u00f3s o resultado do primeiro turno e o resultado nas urnas, a vit\u00f3ria de Lula era poss\u00edvel.\u003C/li\u003E\n\u003C/ol\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "6df9ec2a9a10ed664c4d6c07ef82494b", "console": [], "id": "Hstk", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"inferindo-a-transferencia-de-votos\"\u003EInferindo a transfer\u00eancia de votos\u003C/h2\u003E\n\u003Cspan class=\"paragraph\"\u003EOs dias de vota\u00e7\u00e3o das elei\u00e7\u00f5es presidenciais de 2026 foram 4 de outubro para o primeiro turno e 25 do mesmo m\u00eas para o segundo. Os candidatos tiveram um per\u00edodo de apenas tr\u00eas semanas para convencer o eleitorado e atrair votos para si.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003ENeste cen\u00e1rio de curto per\u00edodo de tempo, \u00e9 razoavelmente seguro considerar que os esfor\u00e7os de campanha tenham se concentrado nos eleitores indecisos, como foi a estrat\u00e9gia da campanha do ent\u00e3o candidato a reelei\u00e7\u00e3o, Lula, no segundo turno\u003Csup id=\"fnref:29-1\"\u003E\u003Ca class=\"footnote-ref\" href=\"#fn:29-1\"\u003E1\u003C/a\u003E\u003C/sup\u003E.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EPor outro lado, para alguns especialistas\u003Csup id=\"fnref:29-2\"\u003E\u003Ca class=\"footnote-ref\" href=\"#fn:29-2\"\u003E2\u003C/a\u003E\u003C/sup\u003E e at\u00e9 para a pr\u00f3pria equipe de campanha do Fl\u00e1vio Bolsonaro, sua vit\u00f3ria parecia ser muito segura. No fim das contas n\u00e3o foi feita nenhuma grande estrat\u00e9gia para garantir a vit\u00f3ria no segundo turno\u003Csup id=\"fnref:29-3\"\u003E\u003Ca class=\"footnote-ref\" href=\"#fn:29-3\"\u003E3\u003C/a\u003E\u003C/sup\u003E.\u003C/span\u003E\n\u003Cdiv class=\"footnote\"\u003E\n\u003Chr /\u003E\n\u003Col\u003E\n\u003Cli id=\"fn:29-1\"\u003E\u003Cstrong\u003ETerra\u003C/strong\u003E. \u003Ca href=\"https://www.terra.com.br/noticias/a-revolucao-da-linguagem-no-segundo-turno-das-eleicoes-de-2026,23066fe203723310bd23f18087066c3f15bi85pz.html?utm_source=clipboard\" rel=\"noopener noreferrer\" target=\"_blank\"\u003EA revolu\u00e7\u00e3o da linguagem no segundo turno das elei\u00e7\u00f5es de 2026\u003C/a\u003E por Djiovanni Marioto\u0026#160;\u003Ca class=\"footnote-backref\" href=\"#fnref:29-1\" title=\"Jump back to footnote 1 in the text\"\u003E\u0026#8617;\u003C/a\u003E\u003C/li\u003E\n\u003Cli id=\"fn:29-2\"\u003E\u003Cstrong\u003EVeja\u003C/strong\u003E. \u003Ca href=\"https://veja.abril.com.br/politica/a-estrategia-de-flavio-e-o-dilema-de-lula-no-segundo-turno/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003EA estrat\u00e9gia de Fl\u00e1vio e o dilema de Lula no segundo turno\u003C/a\u003E\u0026#160;\u003Ca class=\"footnote-backref\" href=\"#fnref:29-2\" title=\"Jump back to footnote 2 in the text\"\u003E\u0026#8617;\u003C/a\u003E\u003C/li\u003E\n\u003Cli id=\"fn:29-3\"\u003E\u003Cstrong\u003EBBC\u003C/strong\u003E. \u003Ca href=\"https://www.bbc.com/portuguese/articles/cmrryxg991d8o\" rel=\"noopener noreferrer\" target=\"_blank\"\u003E'Ele achou que j\u00e1 estava eleito': os erros da campanha de Fl\u00e1vio Bolsonaro no segundo turno apontados por analistas\u003C/a\u003E\u0026#160;\u003Ca class=\"footnote-backref\" href=\"#fnref:29-3\" title=\"Jump back to footnote 3 in the text\"\u003E\u0026#8617;\u003C/a\u003E\u003C/li\u003E\n\u003C/ol\u003E\n\u003C/div\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "d102e125866c2ee334e45c309c52eeb4", "console": [], "id": "nWHF", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch3 id=\"metodologia\"\u003EMetodologia\u003C/h3\u003E\n\u003Cspan class=\"paragraph\"\u003EPara estimar a transfer\u00eancia de votos, ser\u00e1 um modelo de infer\u00eancia de Rosen et al. (2001)\u003Csup id=\"fnref:30-4\"\u003E\u003Ca class=\"footnote-ref\" href=\"#fn:30-4\"\u003E1\u003C/a\u003E\u003C/sup\u003E, mas com uma restri\u00e7\u00e3o: N\u00e3o h\u00e1 transfer\u00eancia de votos entre os candidatos do primeiro turno. Isto significa que todo o potencial de receber votos dos candidatos no segundo turno est\u00e1 entre os eleitores que:\u003C/span\u003E\n\u003Col\u003E\n\u003Cli\u003EVotaram em outros candidatos que n\u00e3o passaram para o segundo turno,\u003C/li\u003E\n\u003Cli\u003EVotaram Branco ou anularam o voto,\u003C/li\u003E\n\u003Cli\u003ESe abstiveram de votar no primeiro turno.\u003C/li\u003E\n\u003C/ol\u003E\n\u003Cspan class=\"paragraph\"\u003EEsta restri\u00e7\u00e3o assume que todos os que votaram no Lula no primeiro turno v\u00e3o continuar votando nele, e o mesmo vale para o Fl\u00e1vio. Embora crie um pressuposto capaz de introduzir vi\u00e9s no modelo, tamb\u00e9m traz outros dois benef\u00edcios importantes na minha an\u00e1lise.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EO vi\u00e9s potencialmente introduzido por esta restri\u00e7\u00e3o \u00e9 controlado pela a diferen\u00e7a entre as datas de vota\u00e7\u00f5es dos turnos. Como a possibilidade de converter um eleitor do candidato advers\u00e1rio aumenta como tempo dispon\u00edvel para a campanha, o prazo de 21 dias provavelmente ser\u00e1 insuficiente para este prop\u00f3sito.\u003C/span\u003E\n\u003Cdiv class=\"footnote\"\u003E\n\u003Chr /\u003E\n\u003Col\u003E\n\u003Cli id=\"fn:30-4\"\u003E\u003Cstrong\u003EStatistica Neerlandica\u003C/strong\u003E. \u003Ca href=\"https://onlinelibrary.wiley.com/doi/abs/10.1111/1467-9574.00162\" rel=\"noopener noreferrer\" target=\"_blank\"\u003EBayesian and Frequentist Inference for Ecological Inference: The R\u00d7C Case\u003C/a\u003E por Ori Rosen, Wenxin Jiang, Gary King e Martin A. Tanner\u0026#160;\u003Ca class=\"footnote-backref\" href=\"#fnref:30-4\" title=\"Jump back to footnote 1 in the text\"\u003E\u0026#8617;\u003C/a\u003E\u003C/li\u003E\n\u003C/ol\u003E\n\u003C/div\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "5ee4cb82b686e36943f7cfc72fe24c42", "console": [], "id": "iLit", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch3 id=\"dados-de-votacao\"\u003EDados de vota\u00e7\u00e3o\u003C/h3\u003E\n\u003Cspan class=\"paragraph\"\u003EPara treinar este modelo ser\u00e3o usados os dados oficiais de vota\u00e7\u00e3o divulgados pelo STE, obtidos pelo reposit\u00f3rio oficial\u003Csup id=\"fnref:513-5\"\u003E\u003Ca class=\"footnote-ref\" href=\"#fn:513-5\"\u003E1\u003C/a\u003E\u003C/sup\u003E.Algumas outras restri\u00e7\u00f5es precisaram ser feitas no modelo empregado por causa de limita\u00e7\u00f5es de \u003Cem\u003Ehardware\u003C/em\u003E:\u003C/span\u003E\n\u003Cul\u003E\n\u003Cli\u003E\u003Cstrong\u003EMem\u00f3ria de v\u00eddeo:\u003C/strong\u003E Para treinar o modelo j\u00e1 com a restri\u00e7\u00e3o mencionada mas usando todas as se\u00e7\u00f5es eleitorais, eu precisaria de aproximadamente 60GB de VRAM, para contornar isso, os dados foram agregados em zonas eleitorais, o que reduz o requisito de VRAM para menos de 1GB.\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003ETempo de processamento:\u003C/strong\u003E A precis\u00e3o e qualidade do resultado depende da quantidade e da qualidade das itera\u00e7\u00f5es realizadas, cada uma delas exige tempo de processamento:\u003Col\u003E\n\u003Cli\u003E\u003Cstrong\u003EQualidade:\u003C/strong\u003E cada itera\u00e7\u00e3o pode ser r\u00e1pida ou n\u00e3o dependendo do tempo que cada uma precisa para atingir uma condi\u00e7\u00e3o de parada, as condi\u00e7\u00f5es podem ser um limite fixo ou o momento que o modelo entende que n\u00e3o far\u00e1 mais progresso mesmo que continue tentando se ajustar. Quase todas as itera\u00e7\u00f5es pararam no limite fixo, o que indica que o modelo provavelmente se ajustaria melhor com um limite fix mais alto, e\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003EQuantidade\u003C/strong\u003E: Com a configura\u00e7\u00e3o \u003Ccode\u003Echains=8\u003C/code\u003E, \u003Ccode\u003Etune=1000\u003C/code\u003E e \u003Ccode\u003Edraws=1000\u003C/code\u003E, o modelo faz 2000 itera\u00e7\u00f5es por grupo, das quais as \u00faltimas 1000 s\u00e3o guardadas na mem\u00f3ria para cada um dos oito grupos trabalhando em paralelo. Esta combina\u00e7\u00e3o exigiu aproximadamente 50 minutos de processamento no meu \u003Cem\u003Ehardware\u003C/em\u003E.\u003C/li\u003E\n\u003C/ol\u003E\n\u003C/li\u003E\n\u003C/ul\u003E\n\u003Cspan class=\"paragraph\"\u003EOs dados de fluxo de votos retornados pelo modelo v\u00e3o divergir um pouco dos n\u00fameros reais da vota\u00e7\u00e3o, eles devem ser interpretados como estimativas, e est\u00e3o sujeitas a uma margem de erro, informada na parte inferior do gr\u00e1fico.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EComo a amostra foi reduzida para menos de 3 mil depois de agrupar por zona eleitoral, ele n\u00e3o atinge um tamanho de amostra efetiva (ESS) suficiente para retornar m\u00e9tricas de erro confi\u00e1veis, mas os fluxos obtidos mostram uma vari\u00e2ncia pequena e propor\u00e7\u00f5es plaus\u00edveis.\u003C/span\u003E\n\u003Cdiv class=\"footnote\"\u003E\n\u003Chr /\u003E\n\u003Col\u003E\n\u003Cli id=\"fn:513-5\"\u003E\u003Cstrong\u003EPortal de Dados Abertos do TSE\u003C/strong\u003E. \u003Ca href=\"https://dadosabertos.tse.jus.br/dataset/resultados-2026/resource/01ea4ccd-f443-469c-9f29-c69ff97f7d4c\" rel=\"noopener noreferrer\" target=\"_blank\"\u003EPresidente - Vota\u00e7\u00e3o por se\u00e7\u00e3o eleitoral - 2026\u003C/a\u003E\u0026#160;\u003Ca class=\"footnote-backref\" href=\"#fnref:513-5\" title=\"Jump back to footnote 1 in the text\"\u003E\u0026#8617;\u003C/a\u003E\u003C/li\u003E\n\u003C/ol\u003E\n\u003C/div\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "2ffacc353cff7a5db69503218ee235a3", "console": [], "id": "ZHCJ", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch3 id=\"fluxo-de-votos-estimado\"\u003EFluxo de votos estimado\u003C/h3\u003E\n\u003Cspan class=\"paragraph\"\u003EO fluxo de votos estimado mostra, diferente do esperado pela equipe do Fl\u00e1vio e de alguns analistas, o Lula conseguindo atrair uma uma parcela relevante do eleitorado que tinha votado em candidatos que n\u00e3o passaram para o segundo turno, e junto com isso, tamb\u00e9m a maior parte dos que se abstiveram e dos que votaram branco e nulo.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "ba 98825f6e7a4d918f8e66f7e7360e302f", "console": [], "id": "Vxnm", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003EEste resultado \u00e9 plaus\u00edvel porque se aproxima muito do resultado obtido nas urnas, incluindo as quantidades de transfer\u00eancia de votos, 3 milh\u00f5es para Fl\u00e1vio e 10 milh\u00f5es para Lula\u003Csup id=\"fnref:34-1\"\u003E\u003Ca class=\"footnote-ref\" href=\"#fn:34-1\"\u003E1\u003C/a\u003E\u003C/sup\u003E, al\u00e9m dos votos Branco e Nulo totais no primeiro e no segundo turno: aproximadamente 6 e 4 milh\u00f5es, respectivamente\u003Csup id=\"fnref2:34-1\"\u003E\u003Ca class=\"footnote-ref\" href=\"#fn:34-1\"\u003E1\u003C/a\u003E\u003C/sup\u003E.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EA quantidade total de absten\u00e7\u00f5es \u00e9 medida pela discrep\u00e2ncia entre a quantidade de votos registrada e a quantidade de eleitores aptos segundo o TSE\u003Csup id=\"fnref:34-2\"\u003E\u003Ca class=\"footnote-ref\" href=\"#fn:34-2\"\u003E2\u003C/a\u003E\u003C/sup\u003E, para a estimativa, o modelo distribui a quantidade total de absten\u00e7\u00f5es entre todas as se\u00e7\u00f5es eleitorais. Al\u00e9m de assumir que n\u00e3o h\u00e1 transfer\u00eancia de votos entre os finalistas, o fato de assumir que a absten\u00e7\u00e3o est\u00e1 distribuida igualmente entre todas as se\u00e7\u00f5es eleitorais pode explicar a leve discrep\u00e2ncia entre os n\u00fameros oficiais e a estimativa.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EPara justificar os 10 milh\u00f5es de votos recebidos pelo candidato Lula, o modelo mediu uma transfer\u00eancia de aproximadamente 4 milh\u00f5es de votos vindo de pessoas que n\u00e3o foram votar no primeiro turno, este n\u00famero pode ser verificado em \u003Ca href=\"https://github.com/VFLins/mini_projects/blob/main/eleicoes2026/data/model_flows.csv\" rel=\"noopener noreferrer\" target=\"_blank\"\u003E\u003Ccode\u003Emodel_flows.csv\u003C/code\u003E\u003C/a\u003E, terceira linha, segunda coluna.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EEsta grande transfer\u00eancia faz sentido quando comparamos a abordagem das campanhas eleitorais durante o segundo turno j\u00e1 discutidas. O cen\u00e1rio que se pode interpretar do resultado do modelo \u00e9:\u003C/span\u003E\n\u003Col\u003E\n\u003Cli\u003EFl\u00e1vio recebeu os tr\u00eas milh\u00f5es de votos \"garantidos\", dos eleitores que o tinham como segunda op\u00e7\u00e3o no primeiro turno, mas como a atvidade da campanha diminuiu depois do resultado do primeiro turno, n\u00e3o conseguiu mais eleitores al\u00e9m desses, enquanto que\u003C/li\u003E\n\u003Cli\u003EA campanha mais ativa de Lula conseguiu convencer os eleitores que ficaram indecisos depois de ver seu candidato perder no primeiro turno, al\u00e9m de converter alguns votos inv\u00e1lidos e muitos eleitores que se abstiveram no primeiro turno.\u003C/li\u003E\n\u003C/ol\u003E\n\u003Cspan class=\"paragraph\"\u003ESe n\u00e3o tivesse convencido as pessoas que n\u00e3o foram votar no primeiro turno, Lula poderia n\u00e3o ter recebido votos o suficiente para ganhar, enquanto que a suspei\u00e7\u00e3o das urnas eletr\u00f4nicas inflada pelos bolsonaristas\u003Csup id=\"fnref:34-3\"\u003E\u003Ca class=\"footnote-ref\" href=\"#fn:34-3\"\u003E3\u003C/a\u003E\u003C/sup\u003E pode acabar fazendo o efeito contr\u00e1rio, desincentivando o comparecimento de seus eleitores \u00e0 vota\u00e7\u00e3o.\u003C/span\u003E\n\u003Cdiv class=\"footnote\"\u003E\n\u003Chr /\u003E\n\u003Col\u003E\n\u003Cli id=\"fn:34-1\"\u003E\u003Cstrong\u003ETSE\u003C/strong\u003E. \u003Ca href=\"https://resultados.tse.jus.br/oficial/app/index.html#/eleicao/6257/uf/br/cargo/1/vis/nominal/resultados\" rel=\"noopener noreferrer\" target=\"_blank\"\u003EElei\u00e7\u00e3o Geral Ordin\u00e1ria 2026\u003C/a\u003E\u0026#160;\u003Ca class=\"footnote-backref\" href=\"#fnref:34-1\" title=\"Jump back to footnote 1 in the text\"\u003E\u0026#8617;\u003C/a\u003E\u003Ca class=\"footnote-backref\" href=\"#fnref2:34-1\" title=\"Jump back to footnote 1 in the text\"\u003E\u0026#8617;\u003C/a\u003E\u003C/li\u003E\n\u003Cli id=\"fn:34-2\"\u003E\u003Cstrong\u003ETSE\u003C/strong\u003E. \u003Ca href=\"https://www.tse.jus.br/comunicacao/noticias/2026/Setembro/faltam-30-dias-brasil-tem-mais-de-158-milhoes-de-eleitoras-e-eleitores-aptos-a-votar\" rel=\"noopener noreferrer\" target=\"_blank\"\u003EFaltam 30 dias: Brasil tem mais de 158 milh\u00f5es de eleitoras e eleitores aptos a votar\u003C/a\u003E\u0026#160;\u003Ca class=\"footnote-backref\" href=\"#fnref:34-2\" title=\"Jump back to footnote 2 in the text\"\u003E\u0026#8617;\u003C/a\u003E\u003C/li\u003E\n\u003Cli id=\"fn:34-3\"\u003E\u003Cstrong\u003EG1\u003C/strong\u003E. \u003Ca href=\"https://g1.globo.com/politica/blog/julia-duailibi/post/2026/07/22/flavio-bolsonaro-urnas.ghtml\" rel=\"noopener noreferrer\" target=\"_blank\"\u003EFl\u00e1vio Bolsonaro repete discurso do pai sobre urnas e amplia desafios para crescer fora da base bolsonarista\u003C/a\u003E\u0026#160;\u003Ca class=\"footnote-backref\" href=\"#fnref:34-3\" title=\"Jump back to footnote 3 in the text\"\u003E\u0026#8617;\u003C/a\u003E\u003C/li\u003E\n\u003C/ol\u003E\n\u003C/div\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "590de26040d18df32b81b6dc52a60435", "console": [], "id": "DnEU", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"rejeicao-e-intencoes-de-voto\"\u003ERejei\u00e7\u00e3o e inten\u00e7\u00f5es de voto\u003C/h2\u003E\n\u003Cspan class=\"paragraph\"\u003EOutro fato importante que levantou a indigna\u00e7\u00e3o do Fl\u00e1vio Bolsonaro e seus apoiadores foi a grande diferen\u00e7a entre a quantidade de votos nas urnas e as inten\u00e7\u00f5es de votos medidas pelas pesquisas realizadas entre o primeiro e o segundo turno.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003ESegundo auditoria independente de Barberia et al. (2026)\u003Csup id=\"fnref:993-1\"\u003E\u003Ca class=\"footnote-ref\" href=\"#fn:993-1\"\u003E1\u003C/a\u003E\u003C/sup\u003E, os institutos de pesquisa apresentaram um vi\u00e9s consistente entre os turnos. O estudo mostrou que a maioria das pesquisas superestimou o desempenho do candidato Lula no primeiro turno e depois da vota\u00e7\u00e3o, passou a fazer o mesmo para o Fl\u00e1vio Bolsonaro no segundo.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EMuitas pesquisas apontavam vantagem para Fl\u00e1vio Bolsonaro nas inten\u00e7\u00f5es de votos, e resultados similarmente favor\u00e1veis a ele na rejei\u00e7\u00e3o. Se um candidato \u00e9 rejeitado por aproximadamente de 50% dos eleitores, n\u00e3o \u00e9 imposs\u00edvel que ele tenha um desempenho competitivo no primeiro turno, mas tenha um segundo turno muito dif\u00edcil tentando disputar a parcela de eleitores que ainda n\u00e3o votou nele no primeiro turno, mas tamb\u00e9m n\u00e3o o rejeita.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EEntre os bolsonaristas, este parecia ser a situa\u00e7a\u00f5 do Lula, as pesquisas apontavam um n\u00edvel de rejei\u00e7\u00e3o mais alta e inten\u00e7\u00f5es de votos mais baixas para ele. O que indicaria uma grande dificuldade de conquistar votos suficientes para virar a disputa ao seu favor no segundo turno.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EA quantidade de votos conquist\u00e1veis por um candidato pode ser definida pela quantidade de eleitores que ainda n\u00e3o decidiram o voto, mas que ainda n\u00e3o o rejeitam. Esta quantidade pode ser estimada pelos dados divulgados pelas pesquisas eleitorais, mas n\u00e3o pode ser confiavelmente mapeada das pesquisas para as vota\u00e7\u00f5es, por alguns motivos:\u003C/span\u003E\n\u003Col\u003E\n\u003Cli\u003EVi\u00e9s apresentado pelas pesquisas pode tamb\u00e9m mostrar valores desajustados com a rejei\u00e7\u00e3o real, al\u00e9m dos desajustes j\u00e1 percebidos nas inten\u00e7\u00f5es de votos\u003Csup id=\"fnref2:993-1\"\u003E\u003Ca class=\"footnote-ref\" href=\"#fn:993-1\"\u003E1\u003C/a\u003E\u003C/sup\u003E;\u003C/li\u003E\n\u003Cli\u003EDistribui\u00e7\u00e3o do comparecimento \u00e0s urnas e votos inv\u00e1lidos n\u00e3o s\u00e3o diretamente alinhados com as respostas \"N\u00e3o opinou\" ou \"N\u00e3o soube responder\" nas pesquisas.\u003C/li\u003E\n\u003C/ol\u003E\n\u003Cspan class=\"paragraph\"\u003EComo as pesquisas n\u00e3o costumam divulgar o cruzamento de dados entre inten\u00e7\u00f5es de votos e rejei\u00e7\u00e3o, teremos que estimar a distribui\u00e7\u00e3o da rejei\u00e7\u00e3o a cada candidato entre entre os que ainda n\u00e3o decidiram o voto e os que j\u00e1 decidiram votar no advers\u00e1rio.\u003C/span\u003E\n\u003Cdiv class=\"admonition warning\"\u003E\n\u003Cspan class=\"admonition-title\"\u003ECuidado ao interpretar os resultados abaixo\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EO conjunto de dados das an\u00e1lises abaixo \u00e9 montado com pesquisas eleitorais, a interpreta\u00e7\u00e3o dos resultados deve se restringir dentro dos limites do que uma pesquisa eleitoral pode oferecer.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003ETodos os valores de inten\u00e7\u00e3o de votos e rejei\u00e7\u00e3o est\u00e3o sujeitos \u00e0:\u003C/span\u003E\n\u003Col\u003E\n\u003Cli\u003EMargem de erro, os valores reais podem n\u00e3o ser exatamente o divulgado;\u003C/li\u003E\n\u003Cli\u003EVi\u00e9s comprovado a favor do candidato Fl\u00e1vio\u003Csup id=\"fnref3:993-1\"\u003E\u003Ca class=\"footnote-ref\" href=\"#fn:993-1\"\u003E1\u003C/a\u003E\u003C/sup\u003E mostra discrep\u00e2ncia acima da margem de erro entre as inten\u00e7\u00f5es de voto divulgadas e o resultado da vota\u00e7\u00e3o, o mesmo n\u00e3o pode ser medido sobre a rejei\u00e7\u00e3o porque n\u00e3o existe uma medida populacional da rejei\u00e7\u00e3o, mas o vi\u00e9s tamb\u00e9m pode estar presente nesta m\u00e9trica;\u003C/li\u003E\n\u003C/ol\u003E\n\u003Cspan class=\"paragraph\"\u003EA an\u00e1lise a seguir depende do conhecimento das limita\u00e7\u00f5es deste conjunto de dados para ser melhor interpretada.\u003C/span\u003E\n\u003C/div\u003E\n\u003Cdiv class=\"footnote\"\u003E\n\u003Chr /\u003E\n\u003Col\u003E\n\u003Cli id=\"fn:993-1\"\u003E\u003Cstrong\u003EJota\u003C/strong\u003E. \u003Ca href=\"https://www.jota.info/opiniao-e-analise/colunas/lorena-barberia/a-eleicao-de-2026-terminou-agora-abram-seus-dados\" rel=\"noopener noreferrer\" target=\"_blank\"\u003EA elei\u00e7\u00e3o de 2026 terminou. Agora, abram seus dados\u003C/a\u003E por Lorena G. Barberia, Nat\u00e1lia de Paula Moreira e Gustavo Fernandes de Paula\u0026#160;\u003Ca class=\"footnote-backref\" href=\"#fnref:993-1\" title=\"Jump back to footnote 1 in the text\"\u003E\u0026#8617;\u003C/a\u003E\u003Ca class=\"footnote-backref\" href=\"#fnref2:993-1\" title=\"Jump back to footnote 1 in the text\"\u003E\u0026#8617;\u003C/a\u003E\u003Ca class=\"footnote-backref\" href=\"#fnref3:993-1\" title=\"Jump back to footnote 1 in the text\"\u003E\u0026#8617;\u003C/a\u003E\u003C/li\u003E\n\u003C/ol\u003E\n\u003C/div\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "b86e711dd8b9001bf40530534ccf7c8c", "console": [], "id": "ulZA", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch3 id=\"dados-de-pesquisas-eleitorais\"\u003EDados de pesquisas eleitorais\u003C/h3\u003E\n\u003Cspan class=\"paragraph\"\u003EA rejei\u00e7\u00e3o \u00e9 medida em um question\u00e1rio por uma pergunta do tipo \"Em qual(is) candidatos voc\u00ea n\u00e3o votaria de jeito nenhum?\", enquanto que a inten\u00e7\u00e3o de voto A diferen\u00e7a entre a rejei\u00e7\u00e3o e a inten\u00e7\u00e3o de voto de um candidato \u00e9 composto por dois grupos: 1. eleitores que ainda n\u00e3o decidiram o voto; e 2. eleitores decididos a votar no candidato advers\u00e1rio.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EEste segundo grupo tamb\u00e9m pode estar presente entre os eleitores que rejeitam o candidato observado. Para entender quantos votos podem ser adquiridos por um candidato no segundo turno, precisamos destas informa\u00e7\u00f5es e da distribui\u00e7\u00e3o de eleitores.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EQuando existe distin\u00e7\u00e3o entre pesquisa estimulada e espont\u00e2nea, vamos preferir a primeira. Algumas pesquisas n\u00e3o distinguem entre o tipo de abordagem, nestes casos, vamos simplesmente usar os valores que estejam dados.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EAqui consideramos que os eleitores com inten\u00e7\u00e3o de votar em um candidato ter\u00e3o respondido \"Pretendo votar neste candidato com certeza\", j\u00e1 a rejei\u00e7\u00e3o ao candidato ser\u00e1 medida pela propor\u00e7\u00e3o de respostas \"N\u00e3o votaria neste candidado de maneira alguma\".\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EIsto quer dizer que dificilmente a mesma pessoa estar\u00e1 entre os eleitores que declararam inten\u00e7\u00e3o de voto e ao mesmo tempo rejeitam o mesmo candidato, o que facilita um pouco a modelagem a seguir.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EA primeira etapa desta an\u00e1lise consiste em montar um conjunto de dados com as inten\u00e7\u00f5es de voto e rejei\u00e7\u00e3o, todas as pesquisas selecionadas foram feitas ap\u00f3s os resultados do primeiro turno:\u003C/span\u003E\n\u003Col\u003E\n\u003Cli\u003E\u003Ca href=\"https://www.futurainteligencia.com.br/pesquisas\" rel=\"noopener noreferrer\" target=\"_blank\"\u003EFutura\u003C/a\u003E: BR-00650/2026, BR-00650/2026, BR-06715/2026\u003C/li\u003E\n\u003Cli\u003E\u003Ca href=\"https://datafolha.folha.uol.com.br/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003EData Folha\u003C/a\u003E: BR-09709/2026 e BR-09540/2026\u003C/li\u003E\n\u003Cli\u003E\u003Ca href=\"https://www.gerp.com.br/relatorios.html\" rel=\"noopener noreferrer\" target=\"_blank\"\u003EGerp\u003C/a\u003E: BR-07877/2026, BR-05187/2026, BR-03835/2026, e BR-09327/2026\u003C/li\u003E\n\u003Cli\u003E\u003Ca href=\"https://www.nexus.fsb.com.br/estudos-divulgados/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003ENexus\u003C/a\u003E: BR-07997/2026, BR-044499/2026 e BR-08234/2026\u003C/li\u003E\n\u003Cli\u003E\u003Ca href=\"https://www.palver.com.br/survey\" rel=\"noopener noreferrer\" target=\"_blank\"\u003EPalver\u003C/a\u003E: BR-00198/2026, BR-08028/2026, BR-04612/2026, e BR-01794/2026\u003C/li\u003E\n\u003Cli\u003E\u003Ca href=\"https://www.poder360.com.br/poderdata/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003EPoder Data\u003C/a\u003E: BR-08134/2026, BR-07926/2026, BR-04258/2026, BR-02586/2026 e BR-01209/2026\u003C/li\u003E\n\u003Cli\u003E\u003Ca href=\"https://quaest.com.br/relatorios-quaest/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003EQuaest\u003C/a\u003E: BR-08535/2026 e BR-09158/2026\u003C/li\u003E\n\u003Cli\u003E\u003Ca href=\"https://voxbrasilpesquisas.com.br/imprensa/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003EVox Brasil\u003C/a\u003E: BR-09623/2026, BR-04332/2026 e BR-03259/2026\u003C/li\u003E\n\u003C/ol\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "42535d3bbc6b423ac392a424080fe3c0", "console": [], "id": "ecfG", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch3 id=\"metodologia\"\u003EMetodologia\u003C/h3\u003E\n\u003Cspan class=\"paragraph\"\u003EPara dizer exatamente quantos votos um candidato pode receber, ainda considerando que um candidato \u003Cmarimo-tex class=\"arithmatex\"\u003E||(A||)\u003C/marimo-tex\u003E n\u00e3o pode conquistar que j\u00e1 est\u00e1 decidido por votar em seu advers\u00e1rio \u003Cmarimo-tex class=\"arithmatex\"\u003E||(B||)\u003C/marimo-tex\u003E, isto significa que o percentual de eleitores conquistaveis por A, \u003Cmarimo-tex class=\"arithmatex\"\u003E||(p_A||)\u003C/marimo-tex\u003E \u00e9 composto pelos percentuais de eleitores que n\u00e3o decidiram o voto \u003Cmarimo-tex class=\"arithmatex\"\u003E||(v_U||)\u003C/marimo-tex\u003E e ao mesmo tempo tamb\u00e9m n\u00e3o o rejeitam:\u003C/span\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||[\np_A = v_U \\times (1 - P(\\text{rejeita A} \\mid \\text{indeciso})) \\tag 1\n||]\u003C/marimo-tex\u003E\u003Cspan class=\"paragraph\"\u003EOs eleitores que rejeitam o candidato \u003Cmarimo-tex class=\"arithmatex\"\u003E||(A||)\u003C/marimo-tex\u003E estar\u00e3o distribu\u00eddos entre os que n\u00e3o decidiram o voto \u003Cmarimo-tex class=\"arithmatex\"\u003E||(v_U||)\u003C/marimo-tex\u003E e os que j\u00e1 decidiram votar no candidato advers\u00e1rio \u003Cmarimo-tex class=\"arithmatex\"\u003E||(v_B||)\u003C/marimo-tex\u003E. No cen\u00e1rio mais favor\u00e1rel, todos os que o rejeitam j\u00e1 decidiram votar no advers\u00e1rio, isto deixa uma propor\u00e7\u00e3o conquist\u00e1vel maior, e no pior cen\u00e1rio, todos os indecisos j\u00e1 o rejeitam, o que significa que a decis\u00e3o deles ser\u00e1 apenas entre votar no advers\u00e1rio, se abster ou votar nulo/branco.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "22a4789eb7d51783f9b738cf50c6571b", "console": [], "id": "Pvdt", "outputs": [{"data": {"text/html": "\u003Cdiv style='display: flex;flex: 1;flex-direction: column;justify-content: flex-start;align-items: normal;flex-wrap: nowrap;gap: 0.5rem'\u003E\u003Cimg src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABXgAAAK8CAYAAABV1dcbAAABbWlUWHRYTUw6Y29tLmFkb2JlLnhtcAAAAAAAPD94cGFja2V0IGJlZ2luPSfvu78nIGlkPSJXNU0wTXBDZWhpSHpyZVN6TlRjemtjOWQiPz48eDp4bXBtZXRhIHhtbG5zOng9ImFkb2JlOm5zOm1ldGEvIj48cmRmOlJERiB4bWxuczpyZGY9Imh0dHA6Ly93d3cudzMub3JnLzE5OTkvMDIvMjItcmRmLXN5bnRheC1ucyMiPjxyZGY6RGVzY3JpcHRpb24gcmRmOmFib3V0PScnIHhtbG5zOnhtcD0naHR0cDovL25zLmFkb2JlLmNvbS94YXAvMS4wLyc+PHhtcDpDcmVhdG9yVG9vbD5DYW52Y kdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003EComo as pesquisas n\u00e3o costumam entregar estat\u00edsticas cruzadas de rejei\u00e7\u00e3o e inten\u00e7\u00e3o de votos, n\u00e3o podemos saber exatamente o percentual de indecisos que rejeitam cada candidato. Esta rejei\u00e7\u00e3o pode estar distribu\u00edda em qualquer ponto entre o pior e o melhor cen\u00e1rio, para medir estes cen\u00e1rios-limite, vamos nos basear nos limites de Fr\u00e9chet (1951)\u003Csup id=\"fnref:39-5\"\u003E\u003Ca class=\"footnote-ref\" href=\"#fn:39-5\"\u003E1\u003C/a\u003E\u003C/sup\u003E \u003Csup id=\"fnref:39-6\"\u003E\u003Ca class=\"footnote-ref\" href=\"#fn:39-6\"\u003E2\u003C/a\u003E\u003C/sup\u003E.\u003C/span\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||[\n\\max(0, v_U + (1 - r_A) - 1) \\le p_A \\le \\min(v_U, (1 - r_A)) \\tag 2\n||]\u003C/marimo-tex\u003E\u003Cspan class=\"paragraph\"\u003EO limite superior original \u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\min(v_U, (1 - r_A))||)\u003C/marimo-tex\u003E pode ficar muito amplo se a rejei\u00e7\u00e3o ao candidato \u003Cmarimo-tex class=\"arithmatex\"\u003E||(A||)\u003C/marimo-tex\u003E for maior que as inten\u00e7\u00f5es de voto ao candidato \u003Cmarimo-tex class=\"arithmatex\"\u003E||(B||)\u003C/marimo-tex\u003E, neste caso, os votos conquist\u00e1veis ser\u00e3o os votos indecisos menos a diferen\u00e7a entre \u003Cmarimo-tex class=\"arithmatex\"\u003E||(r_A||)\u003C/marimo-tex\u003E e  \u003Cmarimo-tex class=\"arithmatex\"\u003E||(v_B||)\u003C/marimo-tex\u003E. Com o ajuste no limite superior, teremos:\u003C/span\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||[\n\\max(0, v_U + (1 - r_A) - 1) \\le p_A \\le v_U - \\max(0, r_A - v_B) \\tag 3\n||]\u003C/marimo-tex\u003E\u003Cdiv class=\"footnote\"\u003E\n\u003Chr /\u003E\n\u003Col\u003E\n\u003Cli id=\"fn:39-5\"\u003E\u003Cstrong\u003EMathematics Magazine\u003C/strong\u003E. \u003Ca href=\"https://doi.org/10.1080/19300980.1951.12467234\" rel=\"noopener noreferrer\" target=\"_blank\"\u003EAbstract Sets, Abstract Spaces and General Analysis\n\u003C/a\u003E\u0026#160;\u003Ca class=\"footnote-backref\" href=\"#fnref:39-5\" title=\"Jump back to footnote 1 in the text\"\u003E\u0026#8617;\u003C/a\u003E\u003C/li\u003E\n\u003Cli id=\"fn:39-6\"\u003E\u003Cstrong\u003EWikipedia\u003C/strong\u003E. \u003Ca href=\"https://en.wikipedia.org/wiki/Fr%C3%A9chet_inequalities\" rel=\"noopener noreferrer\" target=\"_blank\"\u003EFr\u00e9chet inequalities\u003C/a\u003E\u0026#160;\u003Ca class=\"footnote-backref\" href=\"#fnref:39-6\" title=\"Jump back to footnote 2 in the text\"\u003E\u0026#8617;\u003C/a\u003E\u003C/li\u003E\n\u003C/ol\u003E\n\u003C/div\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "99efd0821322ea60eb4bb55df2fe0d30", "console": [], "id": "aLJB", "outputs": [{"data": {"text/html": "\u003Cdiv style='display: flex;flex: 1;flex-direction: column;justify-content: flex-start;align-items: normal;flex-wrap: nowrap;gap: 0.5rem'\u003E\u003Cimg src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABXgAAAK8CAYAAABV1dcbAAABbWlUWHRYTUw6Y29tLmFkb2JlLnhtcAAAAAAAPD94cGFja2V0IGJlZ2luPSfvu78nIGlkPSJXNU0wTXBDZWhpSHpyZVN6TlRjemtjOWQiPz48eDp4bXBtZXRhIHhtbG5zOng9ImFkb2JlOm5zOm1ldGEvIj48cmRmOlJERiB4bWxuczpyZGY9Imh0dHA6Ly93d3cudzMub3JnLzE5OTkvMDIvMjItcmRmLXN5bnRheC1ucyMiPjxyZGY6RGVzY3JpcHRpb24gcmRmOmFib3V0PScnIHhtbG5zOnhtcD0naHR0cDovL25zLmFkb2JlLmNvbS94YXAvMS4wLyc+PHhtcDpDcmVhdG9yVG9vbD5DYW52YSAoTGlnaHRzcGVlZCBMb2NhbCk8L3htcDpDcmVhdG9yVG9vbD48L3JkZjpEZXNjcmlwdGlvbj48L3JkZjpSREY+PC94OnhtcG1ldGE+PD94cGFja2V0IGVuZD0idyI/Ptan2lAAABAASURBVHgB7N0HnBNFG8fxJ3SRqggiIB0VaQqCIigWEERRsYMNC3bF3rtiAxHFjlheEMQG2EWliIoiVVFpUqQX6U3am/9wOXPJ5i535C7tx4fd7M7Ozs58N0d5Mnm20C5+IYAAAggggAACCCCAAAIIIIBAqgswPgQQQACBFBUoZPxCAAEEEEAAAQQQQCBTgA0EEEAAAQQQQAABBBBIJgECvMl0t+grAokkQF8QQAABBBBAAAEEEEAAAQQQQCD1BRhhwgsQ4E34W0QHEUAAAQQQQAABBBBAAIHEF6CHCCCAAAIIIBAfAQK88XHnqggggAACCKSrAONGAAEEEEAAAQQQQAABBBCIoQAB3hhi0lQsBWgLAQQQQAABBBBAAAEEEE dato A tamb\u00e9m n\u00e3o pode ter declarado a inten\u00e7\u00e3o de voto nele.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EEm outras palavras, quem rejeita o candidato A, est\u00e1 em um de dois grupos: 1- N\u00e3o decidiu o voto ainda, ou 2- J\u00e1 decidiu votar em seu advers\u00e1rio. Assim podemos dizer que a distribui\u00e7\u00e3o da rejei\u00e7\u00e3o a \u003Cmarimo-tex class=\"arithmatex\"\u003E||(A||)\u003C/marimo-tex\u003E depende de como estes dois grupos est\u00e3o distribuidos atrav\u00e9s de probabilidades condicionais:\u003C/span\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||[\nr_A = v_B \\cdot P(\\text{rejeita A} \\mid \\text{vota B}) + v_U \\cdot P(\\text{rejeita A} \\mid \\text{indeciso}) \\tag 4\n||]\u003C/marimo-tex\u003E\u003Cspan class=\"paragraph\"\u003EComo n\u00e3o sabemos antecipadamente qual a distribui\u00e7\u00e3o dentro desses grupos, vamos criar um par\u00e2metro \u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\beta||)\u003C/marimo-tex\u003E para testar diferentes distribui\u00e7\u00f5es poss\u00edveis:\u003C/span\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||[\n\\beta = \\frac{ P(\\text{rejeita A} \\mid \\text{indeciso}) }{ P(\\text{rejeita A} \\mid \\text{vota B}) } \\tag 5\n||]\u003C/marimo-tex\u003E\u003Cspan class=\"paragraph\"\u003ENesta configura\u00e7\u00e3o, podemos dizer que quando \u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\beta=1||)\u003C/marimo-tex\u003E, a propor\u00e7\u00e3o de rejei\u00e7\u00f5es \u00e9 igual entre os eleitores do advers\u00e1rio e indecisos. Aumentando o valor, a propor\u00e7\u00e3o passa a ser maior entre os indecisos, e valores entre 0 e 1 aumentam a propor\u00e7\u00e3o entre os eleitores do candidato advers\u00e1rio.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "b444cb22c1dd194da565622b5a5d1eca", "console": [], "id": "xXTn", "outputs": [{"data": {"text/html": "\u003Cdiv style='display: flex;flex: 1;flex-direction: column;justify-content: flex-start matex\"\u003E||[\nP(\\text{rejeita A} \\mid \\text{indeciso}) = \\beta \\cdot \\frac{r_A}{v_B + \\beta \\cdot v_U} \\tag 6\n||]\u003C/marimo-tex\u003E\u003Cspan class=\"paragraph\"\u003ECom isto definido, podemos substituir a equa\u00e7\u00e3o 6 na defini\u00e7\u00e3o inicial da equa\u00e7\u00e3o 1, isto define formalmente o potencial de receber votos de um candidato para qualquer valor de \u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\beta||)\u003C/marimo-tex\u003E:\u003C/span\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||[\np_A = v_U \\times \\left(1 - \\frac{\\beta \\cdot r_A}{v_B + \\beta \\cdot v_U}\\right) \\tag 7\n||]\u003C/marimo-tex\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "76bdadf958a31a91cd17701f92561ba6", "console": [], "id": "pHFh", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch3 id=\"potencial-de-votos-versus-votos-obtidos\"\u003EPotencial de votos versus Votos obtidos\u003C/h3\u003E\n\u003Cspan class=\"paragraph\"\u003EAgora que sabemos como medir a propor\u00e7\u00e3o de votos que podem ser conquistados, podemos encontrar o valor de \u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\beta||)\u003C/marimo-tex\u003E que aproxima o teto ajustado do resultado real das elei\u00e7\u00f5es. Isto nos dar\u00e1 um par\u00e2metro para fixar um \u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\beta||)\u003C/marimo-tex\u003E para cada candidato.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EAs conclus\u00f5es que podem ser tiradas desta abordagem assumem que ambos os candidatos conseguiram aproximadamente todos os votos que poderiam conseguir, e que portanto, nenhum eleitor que tenha anulado o voto ou deixado de votar o fez por falta de esfor\u00e7os de convencimento das partes.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EComo vimos antes, isto s\u00f3 \u00e9 verdade para o candidato Lula, e portanto, o valor de \u003Cmarimo-tex class=\"arithmatex\"\u003E||( 03Cdiv style='display: flex;flex: 1;flex-direction: column;justify-content: flex-start;align-items: center;flex-wrap: nowrap;gap: 0rem'\u003E\u003Cdiv\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003E\u003Cspan style='font-size: 13px'\u003EGr\u00e1fico 2: Conquista de votos ex post\u003C/span\u003E\u003C/span\u003E\u003C/span\u003E\u003C/div\u003E\u003C/div\u003E\u003C/div\u003E"}, "type": "data"}]}, {"code_hash": "8d5c635f904faa1d0452d4e2983fc13b", "console": [], "id": "aqbW", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003EN\u00e3o foi poss\u00edvel encotrar um valor de \u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\beta||)\u003C/marimo-tex\u003E que aproximasse a m\u00e9dia das estimativas mais do que o que j\u00e1 est\u00e1 mostrado no gr\u00e1fico, valores abaixo de 0,1 n\u00e3o t\u00eam impacto no resultado.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EUma poss\u00edvel explica\u00e7\u00e3o para os votos adquiridos pelo Lula estar acima da m\u00e9dia das estimativas est\u00e1 na pr\u00f3pria natureza das pesquisas: As respostas \"n\u00e3o soube responder\" n\u00e3o podem ser mapeadas de nenhuma maneira aceit\u00e1vel para as absten\u00e7\u00f5es e votos inv\u00e1lidos nas urnas.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EUma segunda explica\u00e7\u00e3o plaus\u00edvel, se baseia no fato j\u00e1 identificado de que as pesquisas eleitorais de segundo turno apresentavam vi\u00e9s favor\u00e1vel ao Fl\u00e1vio Bolsonaro nas inten\u00e7\u00f5es de votos, este vi\u00e9s tamb\u00e9m pode ter se refletido nas rejei\u00e7\u00f5es.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EOs vieses das institui\u00e7\u00f5es de pesquisa se anulariam se fossem distribu\u00eddos normalmente, mas a maioria das casas apresentou vi\u00e9s a favor do Fl\u00e1vio acima da margem de erro. Com n\u00edveis menores de rejei\u00e7\u00e3o, a m\u00e9dia das estimativas poderia ser mais alta do que o observado aqui.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EOs dados das pesquisas n\u00e3o permitem dizer quantas pessoas que se abstiveram no primeiro turno passariam a votar no segundo, se desconsiderar-mos os aproximadamente 4 milh\u00f5es de votos adquiridos por Lula desta fonte, a m\u00e9dia das estimativas passaria a ficar pr\u00f3xima dos votos adquiridos.\u003C/span\u003E\n\u003Ch3 id=\"motivos-para-votar\"\u003EMotivos para votar\u003C/h3\u003E\n\u003Cspan class=\"paragraph\"\u003EOutra coisa que vale an\u00e1lise \u00e9 a grande diferen\u00e7a entre os coeficientes \u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\beta||)\u003C/marimo-tex\u003E estimados para cada candidato, se esta diferen\u00e7a \u00e9 verdadeira, significa pode existir uma diferen\u00e7a importante no motivo para o voto entre os eleitores de cada candidato.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EUm valor de \u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\beta||)\u003C/marimo-tex\u003E muito baixo para um candidato pode indicar que uma grande parte do seu eleitorado vota em voc\u00ea por rejei\u00e7\u00e3o ao candidato advers\u00e1rio, isso pode parecer bom \u00e0 primeira vista, porque pode indicar um eleitorado conquist\u00e1vel maior.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EMesmo assim, isto pode ser uma fraqueza, uma vez que seus eleitores podem ter opini\u00f5es mais fortes contra o seu advers\u00e1rio que ao seu favor, isto te torna competitivo contra este candidato em espec\u00edfico, mas fraco contra outros.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EPara testar se este era o caso do candidato Lula, vamos comparar alguns dados das pesquisas e comparar com a correla\u00e7\u00e3o entre as inten\u00e7\u00f5es de votos e n\u00edveis de rejei\u00e7\u00e3o cruzados.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "deb8292861d72c6 nXheezFxQxQxrKmTUDJU+SyOSaubJm4uyBRlIkTURffDbeBm4Rw/O9Y8aIZvH/1o5D9sEpo/rzMyGDJRJMliiSj/LnymayHqtEobz09ctXKpQ3h8n1oGROGdGX6/nW3Qec0RFKWc4sGUyyVeqPu3nnPreX1MmTsGKtEpLYKrej31sqpzqmROF8vCbw4LFT3LYyp0/NWwk4ch9BEARBEAThJ8F+2EvHJwiCIAiCIAiCIAQossZMEARBEARBEAQhkBHFTBAEQRAEQRAEIZARxUwQBEEQBEEQBCGQEcVMEARBEARBEAQhkBHFTBAEQRAEQRAEIZARxUwQBEEQBEEQBCGQEcVMEARBEARBEAQhkBHFTBAEQRAEQRAEIZARxUwQBEEQBEEQBCGQEcVMEARBEARBEAQhkBHFTBAEQRAEQRAEIZARxUwQBEEQBEEQBCGQEcVMEARBEARBEASBApf/AaePKiz3zGkTAAAAAElFTkSuQmCC'/\u003E\u003Cdiv style='display: flex;flex: 1;flex-direction: column;justify-content: flex-start;align-items: center;flex-wrap: nowrap;gap: 0rem'\u003E\u003Cdiv\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003E\u003Cspan style='font-size: 13px'\u003EGr\u00e1fico 4: Inten\u00e7\u00e3o de votos ao Lula x Rejei\u00e7\u00e3o ao Fl\u00e1vio\u003C/span\u003E\u003C/span\u003E\u003C/span\u003E\u003C/div\u003E\u003C/div\u003E\u003C/div\u003E"}, "type": "data"}]}, {"code_hash": "200a07d06f9624740f6512c0bae4525c", "console": [], "id": "dNNg", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003EA an\u00e1lise de correla\u00e7\u00e3o indica uma correla\u00e7\u00e3o forte entre rejei\u00e7\u00e3o e inten\u00e7\u00e3o de  votos, mas apenas nas inten\u00e7\u00f5es de voto ao Fl\u00e1vio Bolsonaro, quando observamos a inten\u00e7\u00e3o de voto no Lula contra a rejei\u00e7\u00e3o ao Fl\u00e1vio, esta correla\u00e7\u00e3o passa a ser muito fraca para ser considerada relevante. Isto fica evidente no coeficiente de inclina\u00e7\u00e3o com confian\u00e7a de 37,9%, que idealmente seria igual ou superior 95%, como nos demais.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EEste resultado discorda do que obtivemos na an\u00e1lise de conquista de votos, mas \u00e9 coerente com o resultado do question\u00e1rio da pesquisa da Palver (BR-01794/2026, p\u00e1gina 29), onde os entrevistados que votariam no Lula justificavam seu voto principalmente com a \"Defesa da democracia e direitos\", enquanto que os eleitores do Fl\u00e1vio justificaram principalmente com a \"Rejei\u00e7\u00e3o ao Lula e o PT\".\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EEsta an\u00e1lise de correla\u00e7\u00e3o mede a distribui\u00e7\u00f5es de inten\u00e7\u00f5es de voto e rejei\u00e7\u00e3o agregados pelas pesquisas, e n\u00e3o leva em considera\u00e7\u00e3o as margens de erro, por isso, tem inten\u00e7\u00e3o de determinar o comportamento individual de cada eleitor, mas de ajudar a identificar um padr\u00e3o entre as pesquisas.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EA presen\u00e7a de uma correla\u00e7\u00e3o mais forte as inten\u00e7\u00f5es de voto ao Fl\u00e1vio e a rejei\u00e7\u00e3o \u00e0 Lula pode ser um indicativo de que o coeficiente \u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\beta||)\u003C/marimo-tex\u003E verdadeiro do candidato era mais baixo do que o medido. A m\u00e9trica pode ter sido superestimada por que ele teve um desempenho abaixo do esperado em atrair votos dos eleitores de candidatos derrotados no primeiro turno, o que \u00e9 coerente com a expectativa de analistas pol\u00edticos mencionados antes.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "3e3153234762a410663e9120271d7aef", "console": [], "id": "yCnT", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"conclusao\"\u003EConclus\u00e3o\u003C/h2\u003E\n\u003Cspan class=\"paragraph\"\u003EA estimativa do fluxo de votos estimou aproximadamente 4 milh\u00f5es de votos vindos das absten\u00e7\u00f5es no primeiro turno, Lula ganhou com vantagem de 4,4 Milh\u00f5es. Isto pode indicar que a camapanha de Lula poderia ter falhado se tivesse se concentrado apenas em conquistar votos de quem votou em outros candidatos no primeiro turno.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EA mesma estimativa tamb\u00e9m mostrou que Fl\u00e1vio n\u00e3o recebeu votos dos antes absentos, e n\u00e3o recebeu todos os votos que esperava dos outros candidatos mais bem colocados, o que \u00e9 coerente com o fato do abrandamento da sua campanha eleitoral no segundo turno, em contraste com a intensifica\u00e7\u00e3o da campanha do seu advers\u00e1rio.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EAp\u00f3s analisar a quantidade de votos conquist\u00e1veis, observamos que Lula conseguiu mais votos do que seria esperado pelas pesquisas eleitorais, o que pode ser explicado tanto pelo vi\u00e9s a favor do Fl\u00e1vio que quase todas as pesquisas eleitorais apresentaram ap\u00f3s o primeiro turno, quanto pelo abrandamento de sua campanha.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EFl\u00e1vio mostra um alto n\u00edvel de correla\u00e7\u00e3o entre inten\u00e7\u00f5es de votos com rejei\u00e7\u00e3o ao advers\u00e1rio, uma distribui\u00e7\u00e3o com \u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\beta||)\u003C/marimo-tex\u003E mais baixo que o medido (como na figura 3). N\u00e3o foi investigado mais a fundo aqui, mas isto pode confirmar que ele teria mais capacidade de atrair votos dos eleitores de outros candidatos.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003ECom muitos de seus votos sendo justificados pela rejei\u00e7\u00e3o ao seu advers\u00e1rio, Fl\u00e1vio se beneficiaria se sua campanha tivesse focado em melhorar sua imagem, mapeando e atacando os maiores receios em rela\u00e7\u00e3o \u00e0 ele entre os eleitores indecisos, al\u00e9m de tentar convencer seus apoiadores a votar, deixando de lado a suspeita \u00e0s urnas.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}], "metadata": {"marimo_version": "0.25.2", "script_metadata_hash": null}, "version": "1"},
