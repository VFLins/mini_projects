    <script data-marimo="true">
      function __resizeIframe(obj) {
        const scrollbarHeight = 20; // Max between windows, mac, and linux

        function setHeight() {
          // Guard against race condition where iframe isn't ready
          if (!obj.contentWindow?.document?.documentElement) {
            return;
          }
          const element = obj.contentWindow.document.documentElement;
          // If there is no vertical scrollbar, we don't need to resize the iframe
          if (element.scrollHeight === element.clientHeight) {
            return;
          }

          // Create a new height that includes the scrollbar height if it's visible
          const hasHorizontalScrollbar = element.scrollWidth > element.clientWidth;
          const newHeight = element.scrollHeight + (hasHorizontalScrollbar ? scrollbarHeight : 0);

          // Only update the height if it's different from the current height
          if (obj.style.height !== `${newHeight}px`) {
            obj.style.height = `${newHeight}px`;
          }
        }

        // Resize the iframe to the height of the content and bottom scrollbar height
        setHeight();

        // Resize the iframe when the content changes
        const resizeObserver = new ResizeObserver((_entries) => {
          setHeight();
        });
        // Only observe if iframe content is ready
        if (obj.contentWindow?.document?.body) {
          resizeObserver.observe(obj.contentWindow.document.body);
        }
      }
    </script>

            "session": {"cells": [{"code_hash": "ab04a3fec33d99e08670a33d164bde45", "console": [], "id": "Hbol", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "1d0db38904205bec4d6f6f6a1f6cec3e", "console": [], "id": "MJUe", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "970fbc65ad9fb9ba1157fb1e785287c4", "console": [], "id": "vblA", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "33f92acd9ddd6d0398b97705c309c907", "console": [], "id": "bkHC", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch1 id=\"entendendo-a-transferencia-de-votos-entre-o-primeiro-e-segundo-turno-das-eleicoes-presidenciais-de-2026\"\u003EEntendendo a transfer\u00eancia de votos entre o primeiro e segundo turno das elei\u00e7\u00f5es presidenciais de 2026\u003C/h1\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "fdbaa7d733a7dcb201a6a9a650224c26", "console": [], "id": "lEQa", "outputs": [{"data": {"text/html": "\u003Cdiv style='display: flex;flex: 1;flex-direction: row;justify-content: space-between;align-items: normal;flex-wrap: nowrap;gap: 0.5rem'\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003EPor: \u003Ca href=\"https://vitorlins.com.br\" rel=\"noopener noreferrer\" target=\"_blank\"\u003EVitor Lins\u003C/a\u003E\u003C/span\u003E\u003C/span\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003E10/11/2026\u003C/span\u003E\u003C/span\u003E\u003C/div\u003E"}, "type": "data"}]}, {"code_hash": "4956aa561f2ecc4aee1b36e87c3a6385", "console": [], "id": "PKri", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Chr /\u003E\n\u003Cspan class=\"paragraph\"\u003EO candidato Fl\u00e1vio Bolsonaro terminou o primeiro turno com uma vota\u00e7\u00e3o maior que a do seu principal advers\u00e1rio Lula, isto levou os bolsonaristas a acreditar que a vit\u00f3ria no segundo turno seria certa, j\u00e1 que hist\u00f3ricamente, o primeiro colocado no primeiro turno sempre acabava ganhando a disputa no segundo turno.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EDepois da derrota, j\u00e1 nos Estados Unidos, Fl\u00e1vio Bolsonaro alegou uma \"impossibilidade matem\u00e1tica\", que permitiu que o seu advers\u00e1rio Lula ganhasse mais de 10 Milh\u00f5es de votos do primeiro para o segundo turno. O objetivo desta an\u00e1lise \u00e9 combinar os dados de vota\u00e7\u00e3o com os resultados de pesquisas de opini\u00e3o anteriores \u00e0s vota\u00e7\u00f5es para entender se esta transfer\u00eancia \u00e9 realmente imposs\u00edvel como alegado.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "7d4801a64e107cecbc7634efaf85ca5f", "console": [], "id": "Xref", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "3a7e65efebe96a7891f76ce698788a17", "console": [], "id": "SFPL", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "bcd63685e5fcf02dae3b9a3e3107b770", "console": [], "id": "BYtC", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "4f716e826903453aca2b2b3f4e319670", "console": [], "id": "RGSE", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "3964e37b6f1e63ed5d91c50ac1deece2", "console": [], "id": "Kclp", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"as-pesquisas-de-intencoes\"\u003EAs pesquisas de inten\u00e7\u00f5es\u003C/h2\u003E\n\u003Cspan class=\"paragraph\"\u003ESe os n\u00fameros estiverem condizentes com o resultado das elei\u00e7\u00f5es, os dados devem estar prontos para a an\u00e1lise. Mas antes de come\u00e7ar, vamos buscar mais informa\u00e7\u00f5es para suportar a an\u00e1lise, para entender a propens\u00e3o dos eleitores a transferir vontos entre candidatos, vamos apoiar e guiar os testes nas inten\u00e7\u00f5es de votos das pesquisas independentes realizadas.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EPara esta an\u00e1lise, vamos considerar as pesquisas de segundo turno:\u003C/span\u003E\n\u003Cul\u003E\n\u003Cli\u003E\u003Ca href=\"https://cnt.org.br/pesquisas\" rel=\"noopener noreferrer\" target=\"_blank\"\u003ECNT\u003C/a\u003E: BR-00652/2026 e BR-02136/2026\u003C/li\u003E\n\u003Cli\u003E\u003Ca href=\"https://www.futurainteligencia.com.br/pesquisas\" rel=\"noopener noreferrer\" target=\"_blank\"\u003EFutura\u003C/a\u003E: BR-00650/2026, BR-00650/2026, BR-06715/2026\u003C/li\u003E\n\u003Cli\u003E\u003Ca href=\"https://datafolha.folha.uol.com.br/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003EData Folha\u003C/a\u003E: BR-09709/2026 e BR-09540/2026\u003C/li\u003E\n\u003Cli\u003E\u003Ca href=\"https://www.gerp.com.br/relatorios.html\" rel=\"noopener noreferrer\" target=\"_blank\"\u003EGerp\u003C/a\u003E: BR-07877/2026, BR-05187/2026, BR-03835/2026, e BR-09327/2026\u003C/li\u003E\n\u003Cli\u003E\u003Ca href=\"https://www.instagram.com/institutofranca.br/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003EInstituto Fran\u00e7a\u003C/a\u003E: BR-07896/2026, BR-04863/2026 e BR-09459/2026\u003C/li\u003E\n\u003Cli\u003E\u003Ca href=\"https://www.nexus.fsb.com.br/estudos-divulgados/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003ENexus\u003C/a\u003E: BR-07997/2026, BR-044499/2026 e BR-08234/2026\u003C/li\u003E\n\u003Cli\u003E\u003Ca href=\"https://www.palver.com.br/survey\" rel=\"noopener noreferrer\" target=\"_blank\"\u003EPalver\u003C/a\u003E: BR-00198/2026, BR-08028/2026, BR-04612/2026, e BR-01794/2026\u003C/li\u003E\n\u003Cli\u003E\u003Ca href=\"https://www.poder360.com.br/poderdata/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003EPoder Data\u003C/a\u003E: BR-08134/2026, BR-07926/2026, BR-04258/2026, BR-02586/2026 e BR-01209/2026\u003C/li\u003E\n\u003Cli\u003E\u003Ca href=\"https://quaest.com.br/relatorios-quaest/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003EQuaest\u003C/a\u003E: BR-08535/2026 e BR-09158/2026\u003C/li\u003E\n\u003Cli\u003E\u003Ca href=\"https://realtimebigdata.com.br/pesquisas/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003ERealtime Big Data\u003C/a\u003E: BR-02952/2026 e BR-09670/2026\u003C/li\u003E\n\u003Cli\u003E\u003Ca href=\"https://voxbrasilpesquisas.com.br/imprensa/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003EVox Brasil\u003C/a\u003E: BR-09623/2026, BR-04332/2026 e BR-03259/2026\u003C/li\u003E\n\u003C/ul\u003E\n\u003Ch2 id=\"rejeicao-do-candidato\"\u003ERejei\u00e7\u00e3o do candidato\u003C/h2\u003E\n\u003Cspan class=\"paragraph\"\u003EA principal m\u00e9trica para avaliar a capacidade de um candidato de receber votos transferidos de outros eleitores que n\u00e3o tinham votado nele no primeiro turno \u00e9 o n\u00edvel de rejei\u00e7\u00e3o. Se a rejei\u00e7\u00e3o a um candidato for maior que 50%, se torna, como dito pelo candidato derrotado, uma \"impossibilidade matem\u00e1tica\".\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EComo veremos mais adiante, muitas pesquisas apontavam vantagem para Fl\u00e1vio Bolsonaro nas inten\u00e7\u00f5es de votos, e resultados similarmente favor\u00e1veis a ele na rejei\u00e7\u00e3o. A diferen\u00e7a entre inten\u00e7\u00f5es de votos e o resultado final das vota\u00e7\u00f5es mostra que existia algum n\u00edvel de vi\u00e9s nas pesquisas.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EComo j\u00e1 temos os resultados das elei\u00e7\u00f5es presidenciais, podemos medir o n\u00edvel de vi\u00e9s das pesquisas, e ajustar a m\u00e9trica de rejei\u00e7\u00e3o para um n\u00edvel mais pr\u00f3ximo do real. Mas vale ressaltar que o vi\u00e9s n\u00e3o representa necessariamente uma prefer\u00eancia do instituto de pesquisa por um candidato, e pode surgir naturalmente durante a sele\u00e7\u00e3o da amostra\u003Csup id=\"fnref:164-1\"\u003E\u003Ca class=\"footnote-ref\" href=\"#fn:164-1\"\u003E1\u003C/a\u003E\u003C/sup\u003E.\u003C/span\u003E\n\u003Ch3 id=\"metodologia\"\u003EMetodologia\u003C/h3\u003E\n\u003Cspan class=\"paragraph\"\u003EExiste uma m\u00e9trica popular, usada especificamente para pesquisas eleitorais baseada na raz\u00e3o de chances logar\u00edtmica\u003Csup id=\"fnref:164-2\"\u003E\u003Ca class=\"footnote-ref\" href=\"#fn:164-2\"\u003E2\u003C/a\u003E\u003C/sup\u003E\u003C/span\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||[\nA' = \\ln \\left( \\frac{ \\hat p_A / (1 - \\hat p_A) }{ p_A / (1 - p_A) } \\right) \\tag 1\n||]\u003C/marimo-tex\u003E\u003Cul\u003E\n\u003Cli\u003E\u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\hat p_A||)\u003C/marimo-tex\u003E: Percentual das inten\u00e7\u00f5es de voto ao candidato A estimadas pela pesquisa\u003C/li\u003E\n\u003Cli\u003E\u003Cmarimo-tex class=\"arithmatex\"\u003E||(p_A||)\u003C/marimo-tex\u003E: Percentual dos votos recebidos pelo candidato A na vota\u00e7\u00e3o\u003C/li\u003E\n\u003C/ul\u003E\n\u003Cspan class=\"paragraph\"\u003EO resultado \u003Cmarimo-tex class=\"arithmatex\"\u003E||(A'||)\u003C/marimo-tex\u003E obtido \u00e9 a medida do vi\u00e9s da pesquisa, favor\u00e1vel ao candidato A, se o valor for positivo, o vi\u00e9s \u00e9 favor\u00e1vel \u00e0 este candidato, caso contr\u00e1rio, o vi\u00e9s \u00e9 favor\u00e1vel ao seu advers\u00e1rio, caso \u003Cmarimo-tex class=\"arithmatex\"\u003E||(A' = 0||)\u003C/marimo-tex\u003E, a  pesquisa n\u00e3o apresenta vi\u00e9s.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EMesmo que diferente de zero, valor da m\u00e9trica ainda est\u00e1 sujeito \u00e0 uma margem de erro para avaliar se o vi\u00e9s medido \u00e9 estatisticamente significante, isto exige a medida do erro padr\u00e3o aproximada pelo m\u00e9todo-\u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\delta||)\u003C/marimo-tex\u003E\u003Csup id=\"fnref:164-3\"\u003E\u003Ca class=\"footnote-ref\" href=\"#fn:164-3\"\u003E3\u003C/a\u003E\u003C/sup\u003E:\u003C/span\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||[\nSE(A') = \\sqrt{\\frac{1}{n \\times \\hat p_A \\times (1 - \\hat p_A)}} \\tag 2\n||]\u003C/marimo-tex\u003E\u003Cul\u003E\n\u003Cli\u003E\u003Cmarimo-tex class=\"arithmatex\"\u003E||(n||)\u003C/marimo-tex\u003E: Quantidade de pessoas entrevistadas na pesquisa\u003C/li\u003E\n\u003C/ul\u003E\n\u003Cspan class=\"paragraph\"\u003ECom isso n\u00f3s podemos fazer um intervalo de 95% de confian\u00e7a para o valor real de \u003Cmarimo-tex class=\"arithmatex\"\u003E||(A'||)\u003C/marimo-tex\u003E, se zero estiver dentro do intervalo, n\u00e3o podemos consider\u00e1-lo significativamente diferente de zero.\u003C/span\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||[\nIC(A') = A' \\pm 1,96 \\times SE(A') \\tag 3\n||]\u003C/marimo-tex\u003E\u003Cspan class=\"paragraph\"\u003EPara encontrar a \"taxa de rejei\u00e7\u00e3o real\" removendo o vi\u00e9s da pesquisa, vamos usar \u003Cmarimo-tex class=\"arithmatex\"\u003E||(A'||)\u003C/marimo-tex\u003E para ajustar o peso das respostas entre os votantes de cada candidato, reduzindo para os super representados ou aumentando para os sub representados.\u003C/span\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||[\nP' = P \\times e^{-A'} \\tag 4\n||]\u003C/marimo-tex\u003E\u003Cul\u003E\n\u003Cli\u003E\u003Cmarimo-tex class=\"arithmatex\"\u003E||(P'||)\u003C/marimo-tex\u003E: Taxa ajustada para o candidato A\u003C/li\u003E\n\u003Cli\u003E\u003Cmarimo-tex class=\"arithmatex\"\u003E||(P||)\u003C/marimo-tex\u003E: Taxa medida pela pesquisa para o candidato A\u003C/li\u003E\n\u003C/ul\u003E\n\u003Cdiv class=\"footnote\"\u003E\n\u003Chr /\u003E\n\u003Col\u003E\n\u003Cli id=\"fn:164-1\"\u003E\u003Cstrong\u003EJota\u003C/strong\u003E. \u003Ca href=\"https://www.jota.info/opiniao-e-analise/colunas/coluna-daniel-marcelino/house-effects-explicam-por-que-pesquisas-eleitorais-sao-tao-diferentes\" rel=\"noopener noreferrer\" target=\"_blank\"\u003E'House effects' explicam por que pesquisas eleitorais s\u00e3o t\u00e3o diferentes\u003C/a\u003E por Daniel Marcelino.\u0026#160;\u003Ca class=\"footnote-backref\" href=\"#fnref:164-1\" title=\"Jump back to footnote 1 in the text\"\u003E\u0026#8617;\u003C/a\u003E\u003C/li\u003E\n\u003Cli id=\"fn:164-2\"\u003E\u003Cstrong\u003EPublic Opinion Quarterly\u003C/strong\u003E. \u003Ca href=\"https://doi.org/10.1093/poq/nfi044\" rel=\"noopener noreferrer\" target=\"_blank\"\u003EA Review and Proposal for a New Measure of Poll Accuracy\u003C/a\u003E por Elizabeth A. Martin, Michael W. Traugott e Courtney Kennedy\u0026#160;\u003Ca class=\"footnote-backref\" href=\"#fnref:164-2\" title=\"Jump back to footnote 2 in the text\"\u003E\u0026#8617;\u003C/a\u003E\u003C/li\u003E\n\u003Cli id=\"fn:164-3\"\u003E\u003Cstrong\u003EConstantin Ahlmann-Eltze\u003C/strong\u003E. \u003Ca href=\"https://const-ae.name/post/2023-02-10_delta_method/delta-method-explainer/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003EWhat is the delta method?\u003C/a\u003E\u0026#160;\u003Ca class=\"footnote-backref\" href=\"#fnref:164-3\" title=\"Jump back to footnote 3 in the text\"\u003E\u0026#8617;\u003C/a\u003E\u003C/li\u003E\n\u003C/ol\u003E\n\u003C/div\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "013c93b27a2a19fe744c73197bb133f2", "console": [], "id": "emfo", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch3 id=\"premissas\"\u003EPremissas\u003C/h3\u003E\n\u003Cspan class=\"paragraph\"\u003EEsta abordagem de an\u00e1lise se apoia em alguns pressupostos, os resultados expostos aqui se tornam inv\u00e1lidos caso ao menos um deles seja falso:\u003C/span\u003E\n\u003Col\u003E\n\u003Cli\u003EO n\u00edvel de rejei\u00e7\u00e3o \u00e9 correlacionado com a inten\u00e7\u00e3o de voto;\u003C/li\u003E\n\u003Cli\u003EA rejei\u00e7\u00e3o aos candidatos n\u00e3o mudou significativamente entre a data da pesquisa e a data da vota\u00e7\u00e3o;\u003C/li\u003E\n\u003Cli\u003EA vota\u00e7\u00e3o registrada nas urnas eletr\u00f4nicas \u00e9 condizente com a realidade.\u003C/li\u003E\n\u003C/ol\u003E\n\u003Cspan class=\"paragraph\"\u003ECom os dados dispon\u00edveis, apenas o primeiro pressuposto pode ser testado, depois que este tenha sido verificado, o leitor basear\u00e1 seu n\u00edvel de confian\u00e7a nos resultados deste estudo na sua cren\u00e7a sobre os outros pressupostos. Para testar a primeira hip\u00f3tese, vamos verificar se existe uma correla\u00e7\u00e3o significativa entre o voto em um candidato, e a rejei\u00e7\u00e3o pelo seu advers\u00e1rio.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EPara fazer esta an\u00e1lise rapidamente, vamos usar os dados de diversas pesquisas eleitorais, comparando as pesquisas de inten\u00e7\u00e3o de voto estimuladas com o percentual de rejei\u00e7\u00e3o, onde o entrevistado responde \"N\u00e3o votaria em ___ de jeito nenhum\".\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003ETodas a pesquisas eleitorais utilizadas foram realizadas ap\u00f3s os resultados do primeiro turno, isto ajuda a normalizar o vi\u00e9s, j\u00e1 que foi encontrado em uma auditoria independente\u003Csup id=\"fnref:20-4\"\u003E\u003Ca class=\"footnote-ref\" href=\"#fn:20-4\"\u003E1\u003C/a\u003E\u003C/sup\u003E que as pesquisas eleitorais apresentaram, em conjunto, vieses para lados diferentes entre o primeiro e segundo turno.\u003C/span\u003E\n\u003Cdiv class=\"footnote\"\u003E\n\u003Chr /\u003E\n\u003Col\u003E\n\u003Cli id=\"fn:20-4\"\u003E\u003Cstrong\u003EJota\u003C/strong\u003E. \u003Ca href=\"https://www.jota.info/opiniao-e-analise/colunas/lorena-barberia/a-eleicao-de-2026-terminou-agora-abram-seus-dados\" rel=\"noopener noreferrer\" target=\"_blank\"\u003EA elei\u00e7\u00e3o de 2026 terminou. Agora, abram seus dados\u003C/a\u003E por Lorena G. Barberia, Nat\u00e1lia de Paula Moreira e Gustavo Fernandes de Paula\u0026#160;\u003Ca class=\"footnote-backref\" href=\"#fnref:20-4\" title=\"Jump back to footnote 1 in the text\"\u003E\u0026#8617;\u003C/a\u003E\u003C/li\u003E\n\u003C/ol\u003E\n\u003C/div\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "118baa460edef67208c3dd4e9929e862", "console": [], "id": "Hstk", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003E\u003Cbr /\u003E\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "6bb3ca5efba9dde32aa21da7594adbcb", "console": [], "id": "nWHF", "outputs": [{"data": {"text/html": "\u003Cimg src='data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAv4AAAJgCAYAAADyCWeKAAAAOnRFWHRTb2Z0d2FyZQBNYXRwbG90bGliIHZlcnNpb24zLjExLjIsIGh0dHBzOi8vbWF0cGxvdGxpYi5vcmcvgI3uAAAAAAlwSFlzAAAPYQAAD2EBqD+naQABAABJREFUeJzs3QV0FFcXB/AbIEBwd3dtgOJeKN4CheIuxS24u7s7xd2dQHGnQHF31wQPJMB+5//a2W93sxpP9v87JyfJ7Nvd2ZnZ3Ttv7rvPRafT6YSIiIiIiCK0SKG9AkREREREFPwY+BMREREROQEG/kREREREToCBPxERERGRE2DgT0RERETkBBj4ExERERE5AQb+REREREROIIo4gS++fuL19r3+/wRxY0u0qK6huk5ERERERCHJKQJ/BP1b9h7X/1+1bBFJnjhBqK4TEREREVFIYqoPEREREZETYOBPREREROQEGPgTERERETkBBv5ERERERE6AgT8RERERkRNg4E9ERERE5AQY+BMREREROQEG/kREREREToCBPxERERGRE3CKmXuJiIiIiIKDTqeT1z4+8sHXV2JFjSoJ3dzExcVFwiIG/kREREREDnrz+bMsPn9epp06Jbe9vfXLM8aPLx0LFpQm7u4SL3p0CUtcdDhNieCevvSSLXuP6/+vWraIJE+cIFTXiYiIiIjCJ89bt6Tm2rXyyc9P/W8YTGt9/TFcXWV9rVpSIVMmCZc9/l+/fpVFixZZvL1ly5Zml9+9e1fOnDkjvr6+kj17dsmbN6/Fx/jnn3/k8uXLqt2PP/5ots2FCxdUu0aNGkmkSBymQEREREQhF/RXWblSpfiY6z3Xlvn4+al22+vVCzPBv0OB//379+WPP/6wO/B/8+aNNG3aVDZv3my0vHjx4rJ+/XpJkiSJ0fLRo0dLnz599P+PHDnS6H949+6d/Prrr2o9GPQTERERUUim99Rcu1YF/d9ttMXtkXQ61f6Rh0eYSPtxqLv89u3b6jd6/X18fPz9mGrevLns3LlTxo0bp3r9Hz9+LNOnT5e///5bWrRo4a/92LFjVS//ixcv1G/cz1THjh0lbdq0/k4IiIiIiIiC0+Lz51V6j62gX4N2aL/k/Pnw1+OvBf5Iw4lux1lL0qRJZcKECdKhQwf9svbt28vBgwdl+/bt/tq/fftWsmbNKokTJ1a/z507Z3T7pk2bZMuWLXL+/HmJHDmyI6tORERERBRg6OXHQN6AmHrqlBrwG9rVfgIU+CdKlEiWLVsmjx49kkyZMskvv/xi9kRg1qxZ/pbhygBy+HPmzOnvNvTy44Sge/fu6ne+fPn0t718+VJat24ts2fPljRp0jiy2kREREREgYKSnYbVe tado do question\u00e1rio da pesquisa da Palver (BR-01794/2026, p\u00e1gina 29), onde os entrevistados que votariam no Lula justificavam seu voto principalmente com a \"Defesa da democracia e direitos\", enquanto que os eleitores do Fl\u00e1vio justificaram principalmente com a \"Rejei\u00e7\u00e3o ao Lula e o PT\".\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EIsso significa que podemos medir uma rejei\u00e7\u00e3o ao Lula ajustada pelo vi\u00e9s das pesquisas, mas n\u00e3o podemos fazer o mesmo para o seu advers\u00e1rio com seguran\u00e7a, j\u00e1 que a correla\u00e7\u00e3o com as inten\u00e7\u00f5es de voto ao Lula \u00e9 muito fraca.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "edeb40581bb85b37454b0e53352b6774", "console": [], "id": "ROlb", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"ajustando-as-pesquisas-eleitorais\"\u003EAjustando as pesquisas eleitorais\u003C/h2\u003E\n\u003Cspan class=\"paragraph\"\u003EAs pesquisas eleitorais apontavam um cen\u00e1rio favor\u00e1vel para o candidato Fl\u00e1vio Bolsonaro no segundo turno, agora vamos comparar o resultado previsto pelas pesquisas, o das pesquisas ajustado pela m\u00e9trica \u003Cmarimo-tex class=\"arithmatex\"\u003E||(A'||)\u003C/marimo-tex\u003E de Martin et al. (2005), e comparar com o resultado real das vota\u00e7\u00f5es:\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "fc7b88a99686df3a38e6270ace36dea4", "console": [], "id": "qnkX", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "522697092e8195540b29064c7009ea9a", "console": [], "id": "TqIu", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "94bcc4d4f6de352e3f0008f17d382a47", "console": [], "id": "Vxnm", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "4c62fd580a455ddd38bbf14749a00c22", "console": [], "id": "DnEU", "outputs": [{"data": {"text/m
