    <script data-marimo="true">
      function __resizeIframe(obj) {
        const scrollbarHeight = 20; // Max between windows, mac, and linux

        function setHeight() {
          // Guard against race condition where iframe isn't ready
          if (!obj.contentWindow?.document?.documentElement) {
            return;
          }
          const element = obj.contentWindow.document.documentElement;
          // If there is no vertical scrollbar, we don't need to resize the iframe
          if (element.scrollHeight === element.clientHeight) {
            return;
          }

          // Create a new height that includes the scrollbar height if it's visible
          const hasHorizontalScrollbar = element.scrollWidth > element.clientWidth;
          const newHeight = element.scrollHeight + (hasHorizontalScrollbar ? scrollbarHeight : 0);

          // Only update the height if it's different from the current height
          if (obj.style.height !== `${newHeight}px`) {
            obj.style.height = `${newHeight}px`;
          }
        }

        // Resize the iframe to the height of the content and bottom scrollbar height
        setHeight();

        // Resize the iframe when the content changes
        const resizeObserver = new ResizeObserver((_entries) => {
          setHeight();
        });
        // Only observe if iframe content is ready
        if (obj.contentWindow?.document?.body) {
          resizeObserver.observe(obj.contentWindow.document.body);
        }
      }
    </script>

ontents\"\u003E\u003Cspan class=\"paragraph\"\u003E\u003Ca href=\"https://github.com/VFLins/mini_projects/tree/main/eleicoes2026\" rel=\"noopener noreferrer\" target=\"_blank\"\u003E\u003Cimg alt=\"Reposit\u00f3rio\" src=\"https://img.shields.io/badge/Reposit%C3%B3rio-white?logo=github\u0026amp;logoColor=212c38\u0026amp;style=for-the-badge\" /\u003E\u003C/a\u003E\u003C/span\u003E\u003C/span\u003E\u003C/div\u003E"}, "type": "data"}]}, {"code_hash": "33f92acd9ddd6d0398b97705c309c907", "console": [], "id": "BYtC", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch1 id=\"entendendo-a-transferencia-de-votos-entre-o-primeiro-e-segundo-turno-das-eleicoes-presidenciais-de-2026\"\u003EEntendendo a transfer\u00eancia de votos entre o primeiro e segundo turno das elei\u00e7\u00f5es presidenciais de 2026\u003C/h1\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "579de3ac3148778924b3f42713533345", "console": [], "id": "RGSE", "outputs": [{"data": {"text/html": "\u003Cdiv style='display: flex;flex: 1;flex-direction: row;justify-content: space-between;align-items: normal;flex-wrap: nowrap;gap: 0.5rem'\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003EPor: \u003Ca href=\"https://vitorlins.com.br\" rel=\"noopener noreferrer\" target=\"_blank\"\u003EVitor Lins\u003C/a\u003E\u003C/span\u003E\u003C/span\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003E14/11/2026\u003C/span\u003E\u003C/span\u003E\u003C/div\u003E"}, "type": "data"}]}, {"code_hash": "f7e0d0bf91bd8c475723d6f52b6c1267", "console": [], "id": "Kclp", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Chr /\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003C/br\u003E\u003C/span\u003E\n\u003Cdiv class=\"admonition note\"\u003E\n\u003Cspan class=\"admonition-title\"\u003EResumo\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EVou colocar o resumo aqui quando o trabalho estiver pronto.\u003C/span\u003E\n\u003C/div\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cbr/ \u003E\u003C/span\u003E\n\u003Ch2 id=\"introducao\"\u003EIntrodu\u00e7\u00e3o\u003C/h2\u003E\n\u003Cspan class=\"paragraph\"\u003EO candidato Fl\u00e1vio Bolsonaro terminou o primeiro turno com uma vota\u00e7\u00e3o maior que a do seu principal advers\u00e1rio Lula, isto levou os bolsonaristas a acreditar que a vit\u00f3ria no segundo turno seria certa, j\u00e1 que historicamente, o primeiro colocado no primeiro turno sempre acabava ganhando a disputa no segundo turno.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EDepois da derrota, j\u00e1 nos Estados Unidos, Fl\u00e1vio Bolsonaro alegou uma \"impossibilidade matem\u00e1tica\", que permitiu que o seu advers\u00e1rio Lula ganhasse mais de 10 Milh\u00f5es de votos do primeiro para o segundo turno. O objetivo desta an\u00e1lise \u00e9 combinar os dados de vota\u00e7\u00e3o com os resultados de pesquisas de opini\u00e3o anteriores \u00e0s vota\u00e7\u00f5es do segundo turno para entender se esta transfer\u00eancia \u00e9 realmente imposs\u00edvel como alegado.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "9c1261a551bf30fddb3ff433e79c4e2d", "console": [], "id": "emfo", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"metodologia\"\u003EMetodologia\u003C/h2\u003E\n\u003Cspan class=\"paragraph\"\u003ENesta se\u00e7\u00e3o vamos entender os dados que ser\u00e3o usados e como a an\u00e1lise ser\u00e1 feita dos dados ser\u00e1 feita. Vamos come\u00e7ar buscando informa\u00e7\u00f5es adicionais para suportar a an\u00e1lise, para entender a propens\u00e3o dos eleitores a transferir vontos entre candidatos, vamos apoiar e guiar os testes nas inten\u00e7\u00f5es de votos das pesquisas independentes realizadas.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "a57e1444b009e55000b5bbbb4cb441db", "console": [], "id": "Hstk", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch3 id=\"dados-de-rejeicao-e-intencao-de-votos\"\u003EDados de rejei\u00e7\u00e3o e inten\u00e7\u00e3o de votos\u003C/h3\u003E\n\u003Cspan class=\"paragraph\"\u003EA rejei\u00e7\u00e3o \u00e9 medida em um question\u00e1rio por uma pergunta do tipo \"Em qual(is) candidatos voc\u00ea n\u00e3o votaria de jeito nenhum?\". A diferen\u00e7a entre a rejei\u00e7\u00e3o e a inten\u00e7\u00e3o de voto de um candidato \u00e9 composto por, eleitores que ainda n\u00e3o decidiram o voto e eleitores decididos a votar em outro candidato.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EPara entender quantos votos podem ser adquiridos por um candidato no segundo turno, precisamos saber sua rejei\u00e7\u00e3o e os votos decididos para o seu advers\u00e1rio. As pessoas que n\u00e3o se encaixam em nenhum dos dois grupos s\u00e3o os votos mais poss\u00edveis de conquistar.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EA primeira etapa desta pesquisa consiste em montar um conjunto de dados com as inten\u00e7\u00f5es de voto e rejei\u00e7\u00e3o, todas as pesquisas selecionadas foram feitas ap\u00f3s os resultados do primeiro turno:\u003C/span\u003E\n\u003Col\u003E\n\u003Cli\u003E\u003Ca href=\"https://www.futurainteligencia.com.br/pesquisas\" rel=\"noopener noreferrer\" target=\"_blank\"\u003EFutura\u003C/a\u003E: BR-00650/2026, BR-00650/2026, BR-06715/2026\u003C/li\u003E\n\u003Cli\u003E\u003Ca href=\"https://datafolha.folha.uol.com.br/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003EData Folha\u003C/a\u003E: BR-09709/2026 e BR-09540/2026\u003C/li\u003E\n\u003Cli\u003E\u003Ca href=\"https://www.gerp.com.br/relatorios.html\" rel=\"noopener noreferrer\" target=\"_blank\"\u003EGerp\u003C/a\u003E: BR-07877/2026, BR-05187/2026, BR-03835/2026, e BR-09327/2026\u003C/li\u003E\n\u003Cli\u003E\u003Ca href=\"https://www.nexus.fsb.com.br/estudos-divulgados/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003ENexus\u003C/a\u003E: BR-07997/2026, BR-044499/2026 e BR-08234/2026\u003C/li\u003E\n\u003Cli\u003E\u003Ca href=\"https://www.palver.com.br/survey\" rel=\"noopener noreferrer\" target=\"_blank\"\u003EPalver\u003C/a\u003E: BR-00198/2026, BR-08028/2026, BR-04612/2026, e BR-01794/2026\u003C/li\u003E\n\u003Cli\u003E\u003Ca href=\"https://www.poder360.com.br/poderdata/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003EPoder Data\u003C/a\u003E: BR-08134/2026, BR-07926/2026, BR-04258/2026, BR-02586/2026 e BR-01209/2026\u003C/li\u003E\n\u003Cli\u003E\u003Ca href=\"https://quaest.com.br/relatorios-quaest/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003EQuaest\u003C/a\u003E: BR-08535/2026 e BR-09158/2026\u003C/li\u003E\n\u003Cli\u003E\u003Ca href=\"https://voxbrasilpesquisas.com.br/imprensa/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003EVox Brasil\u003C/a\u003E: BR-09623/2026, BR-04332/2026 e BR-03259/2026\u003C/li\u003E\n\u003C/ol\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "5d3cc688b0f539499e932d1e261e9cf1", "console": [], "id": "nWHF", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch3 id=\"potencial-de-conquistar-votos\"\u003EPotencial de conquistar votos\u003C/h3\u003E\n\u003Cspan class=\"paragraph\"\u003EOs dias de vota\u00e7\u00e3o das elei\u00e7\u00f5es presidenciais de 2026 foram 4 de outubro para o primeiro turno e 25 do mesmo m\u00eas para o segundo. Os candidatos tiveram um per\u00edodo de apenas tr\u00eas semanas para convencer o eleitorado e atrair votos para si.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003ENeste cen\u00e1rio de curto per\u00edodo de tempo, \u00e9 mais seguro considerar que os esfor\u00e7os de campnha devem ser concentrados nos eleitores indecisos, esta acabou sendo a estrat\u00e9gia da campanha do ent\u00e3o candidato Lula no segundo turno\u003Csup id=\"fnref:28-1\"\u003E\u003Ca class=\"footnote-ref\" href=\"#fn:28-1\"\u003E1\u003C/a\u003E\u003C/sup\u003E.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EPor outro lado, para alguns especialistas\u003Csup id=\"fnref:28-2\"\u003E\u003Ca class=\"footnote-ref\" href=\"#fn:28-2\"\u003E2\u003C/a\u003E\u003C/sup\u003E e at\u00e9 para a pr\u00f3pria equipe de campanha do Fl\u00e1vio Bolsonaro\u003Csup id=\"fnref:28-3\"\u003E\u003Ca class=\"footnote-ref\" href=\"#fn:28-3\"\u003E3\u003C/a\u003E\u003C/sup\u003E, sua vit\u00f3ria parecia ser muito segura. No fim das contas n\u00e3o foi feita nenhuma grande estrat\u00e9gia para garantir a vit\u00f3ria no segundo turno.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EPara analisar o potencial de receber votos de cada candidato, vamos seguir um modelo que considera que os candidatos s\u00f3 podem conquistar votos dos eleitores que:\u003C/span\u003E\n\u003Col\u003E\n\u003Cli\u003EN\u00e3o tenham seu voto decidido para nenhum candidato, e\u003C/li\u003E\n\u003Cli\u003EN\u00e3o o rejeita.\u003C/li\u003E\n\u003C/ol\u003E\n\u003Cspan class=\"paragraph\"\u003EIsto coloca os eleitores entrevistados em diferentes grupos em rela\u00e7\u00e3o a cada candidato e sua rejei\u00e7\u00e3o ou decis\u00e3o de voto:\u003C/span\u003E\n\u003Ctable\u003E\n\u003Cthead\u003E\n\u003Ctr\u003E\n\u003Cth style=\"text-align: left;\"\u003E\u003C/th\u003E\n\u003Cth style=\"text-align: center;\"\u003EFl\u00e1vio\u003C/th\u003E\n\u003Cth style=\"text-align: center;\"\u003ELula\u003C/th\u003E\n\u003Cth style=\"text-align: center;\"\u003EN\u00e3o definido\u003C/th\u003E\n\u003C/tr\u003E\n\u003C/thead\u003E\n\u003Ctbody\u003E\n\u003Ctr\u003E\n\u003Ctd style=\"text-align: left;\"\u003E\u003Cstrong\u003EVoto decidido\u003C/strong\u003E\u003C/td\u003E\n\u003Ctd style=\"text-align: center;\"\u003E\u003Cmarimo-tex class=\"arithmatex\"\u003E||(V_A||)\u003C/marimo-tex\u003E\u003C/td\u003E\n\u003Ctd style=\"text-align: center;\"\u003E\u003Cmarimo-tex class=\"arithmatex\"\u003E||(V_B||)\u003C/marimo-tex\u003E\u003C/td\u003E\n\u003Ctd style=\"text-align: center;\"\u003E\u003Cmarimo-tex class=\"arithmatex\"\u003E||(V_U||)\u003C/marimo-tex\u003E\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd style=\"text-align: left;\"\u003E\u003Cstrong\u003ERejeita\u003C/strong\u003E\u003C/td\u003E\n\u003Ctd style=\"text-align: center;\"\u003E\u003Cmarimo-tex class=\"arithmatex\"\u003E||(R_A||)\u003C/marimo-tex\u003E\u003C/td\u003E\n\u003Ctd style=\"text-align: center;\"\u003E\u003Cmarimo-tex class=\"arithmatex\"\u003E||(R_B||)\u003C/marimo-tex\u003E\u003C/td\u003E\n\u003Ctd style=\"text-align: center;\"\u003E\u003Cmarimo-tex class=\"arithmatex\"\u003E||(R_U||)\u003C/marimo-tex\u003E\u003C/td\u003E\n\u003C/tr\u003E\n\u003C/tbody\u003E\n\u003C/table\u003E\n\u003Cspan class=\"paragraph\"\u003EPara viabilizar a an\u00e1lise neste modelo, vamos precisar definir algumas restri\u00e7\u00f5es l\u00f3gicas:\u003C/span\u003E\n\u003Col\u003E\n\u003Cli\u003EUma pessoa que rejeita um candidato n\u00e3o pode pretender votar no mesmo,\u003C/li\u003E\n\u003Cli\u003EUma pessoa com voto indefinido n\u00e3o pode ter voto decidio por um candidato,\u003C/li\u003E\n\u003Cli\u003EUma pessoa com voto decidido em um candidato n\u00e3o pode tamb\u00e9m ter voto decidido em outro ou indefinido.\u003C/li\u003E\n\u003C/ol\u003E\n\u003Cspan class=\"paragraph\"\u003EEsta \u00faltima foi colocada por que usaremos apenas dados de pesquisas realizadas entre o primeiro e segundo turno, neste intervalo de tempo de 21 dias, um eleitor com voto decidido dificilmente mudaria de opini\u00e3o.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EEstas restri\u00e7\u00f5es facilitam a an\u00e1lise porque eliminam a possibilidade de algumas intersec\u00e7\u00f5es ocorrerem entre os grupos, alguns tipos de intersec\u00e7\u00f5es poss\u00edveis incluem ter o voto decidido no Fl\u00e1vio e rejeitar seu advers\u00e1rio \u003Cmarimo-tex class=\"arithmatex\"\u003E||((V_A \\cap R_B)||)\u003C/marimo-tex\u003E ou ter o voto decidido no Fl\u00e1vio e n\u00e3o rejeitar nenhum \u003Cmarimo-tex class=\"arithmatex\"\u003E||((V_A \\cap R_U)||)\u003C/marimo-tex\u003E.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EConhecer estas intersec\u00e7\u00f5es \u00e9 importante para descobrir o \"Potencial de aquisi\u00e7\u00e3o de votos\" de cada candidato \u003Cmarimo-tex class=\"arithmatex\"\u003E||(P_A||)\u003C/marimo-tex\u003E e \u003Cmarimo-tex class=\"arithmatex\"\u003E||(P_B||)\u003C/marimo-tex\u003E, este n\u00famero indicaria a quantidade de eleitores podem ser conquistados por um candidato no segundo turno. Voltando na defini\u00e7\u00e3o dada antes e o total de entrevistados \u003Cmarimo-tex class=\"arithmatex\"\u003E||(N||)\u003C/marimo-tex\u003E:\u003C/span\u003E\n\u003Cblockquote\u003E\n\u003Cspan class=\"paragraph\"\u003Eos candidatos s\u00f3 podem conquistar votos dos eleitores que:\n1. N\u00e3o tenham seu voto decidido para nenhum candidato, e\n2. N\u00e3o o rejeita.\u003C/span\u003E\n\u003C/blockquote\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||[\nP_A = V_U \\cap (N - R_A) \\tag 1\n||]\u003C/marimo-tex\u003E\u003Cmarimo-tex class=\"arithmatex\"\u003E||[\nP_B = V_U \\cap (N - R_A) \\tag 2\n||]\u003C/marimo-tex\u003E\u003Cspan class=\"paragraph\"\u003EPodemos resolver (R_B \\cup R_U) como sendo simplesmente a popula\u00e7\u00e3o que n\u00e3o rejeita o candidato A\u003C/span\u003E\n\u003Cdiv class=\"footnote\"\u003E\n\u003Chr /\u003E\n\u003Col\u003E\n\u003Cli id=\"fn:28-1\"\u003E\u003Cstrong\u003ETerra\u003C/strong\u003E. \u003Ca href=\"https://www.terra.com.br/noticias/a-revolucao-da-linguagem-no-segundo-turno-das-eleicoes-de-2026,23066fe203723310bd23f18087066c3f15bi85pz.html?utm_source=clipboard\" rel=\"noopener noreferrer\" target=\"_blank\"\u003EA revolu\u00e7\u00e3o da linguagem no segundo turno das elei\u00e7\u00f5es de 2026\u003C/a\u003E por Djiovanni Marioto\u0026#160;\u003Ca class=\"footnote-backref\" href=\"#fnref:28-1\" title=\"Jump back to footnote 1 in the text\"\u003E\u0026#8617;\u003C/a\u003E\u003C/li\u003E\n\u003Cli id=\"fn:28-2\"\u003E\u003Cstrong\u003EVeja\u003C/strong\u003E. \u003Ca href=\"https://veja.abril.com.br/politica/a-estrategia-de-flavio-e-o-dilema-de-lula-no-segundo-turno/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003EA estrat\u00e9gia de Fl\u00e1vio e o dilema de Lula no segundo turno\u003C/a\u003E\u0026#160;\u003Ca class=\"footnote-backref\" href=\"#fnref:28-2\" title=\"Jump back to footnote 2 in the text\"\u003E\u0026#8617;\u003C/a\u003E\u003C/li\u003E\n\u003Cli id=\"fn:28-3\"\u003E\u003Cstrong\u003EBBC\u003C/strong\u003E. \u003Ca href=\"https://www.bbc.com/portuguese/articles/cmrryxg991d8o\" rel=\"noopener noreferrer\" target=\"_blank\"\u003E'Ele achou que j\u00e1 estava eleito': os erros da campanha de Fl\u00e1vio Bolsonaro no segundo turno apontados por analistas\u003C/a\u003E\u0026#160;\u003Ca class=\"footnote-backref\" href=\"#fnref:28-3\" title=\"Jump back to footnote 3 in the text\"\u003E\u0026#8617;\u003C/a\u003E\u003C/li\u003E\n\u003C/ol\u003E\n\u003C/div\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "23a365afe259a9918c8975a34b7fb2b7", "console": [], "id": "iLit", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003ESegundo auditoria independente de Barberia et al. (2026)\u003Csup id=\"fnref:29-4\"\u003E\u003Ca class=\"footnote-ref\" href=\"#fn:29-4\"\u003E1\u003C/a\u003E\u003C/sup\u003E, os institutos de pesquisa apresentaram um vi\u00e9s consistente entre os turnos, em que a maioria superestimou o desempenho do candidato Lula no primeiro turno e depois o subestimou no segundo.\u003C/span\u003E\n\u003Cdiv class=\"footnote\"\u003E\n\u003Chr /\u003E\n\u003Col\u003E\n\u003Cli id=\"fn:29-4\"\u003E\u003Cstrong\u003EJota\u003C/strong\u003E. \u003Ca href=\"https://www.jota.info/opiniao-e-analise/colunas/lorena-barberia/a-eleicao-de-2026-terminou-agora-abram-seus-dados\" rel=\"noopener noreferrer\" target=\"_blank\"\u003EA elei\u00e7\u00e3o de 2026 terminou. Agora, abram seus dados\u003C/a\u003E por Lorena G. Barberia, Nat\u00e1lia de Paula Moreira e Gustavo Fernandes de Paula\u0026#160;\u003Ca class=\"footnote-backref\" href=\"#fnref:29-4\" title=\"Jump back to footnote 1 in the text\"\u003E\u0026#8617;\u003C/a\u003E\u003C/li\u003E\n\u003C/ol\u003E\n\u003C/div\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "7d6351fad429422213b7fb910a8a28c9", "console": [], "id": "ZHCJ", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"rejeicao-do-candidato\"\u003ERejei\u00e7\u00e3o do candidato\u003C/h2\u003E\n\u003Cspan class=\"paragraph\"\u003EA principal m\u00e9trica para avaliar a capacidade de um candidato de receber votos transferidos de outros eleitores que n\u00e3o tinham votado nele no primeiro turno \u00e9 o n\u00edvel de rejei\u00e7\u00e3o. Se a rejei\u00e7\u00e3o a um candidato for maior que 50%, se torna, como dito pelo candidato derrotado, uma \"impossibilidade matem\u00e1tica\".\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EComo veremos mais adiante, muitas pesquisas apontavam vantagem para Fl\u00e1vio Bolsonaro nas inten\u00e7\u00f5es de votos, e resultados similarmente favor\u00e1veis a ele na rejei\u00e7\u00e3o. A diferen\u00e7a entre inten\u00e7\u00f5es de votos e o resultado final das vota\u00e7\u00f5es mostra que existia algum n\u00edvel de vi\u00e9s nas pesquisas.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EComo j\u00e1 temos os resultados das elei\u00e7\u00f5es presidenciais, podemos medir o n\u00edvel de vi\u00e9s das pesquisas, e ajustar a m\u00e9trica de rejei\u00e7\u00e3o para um n\u00edvel mais pr\u00f3ximo do real. Mas vale ressaltar que o vi\u00e9s n\u00e3o representa necessariamente uma prefer\u00eancia do instituto de pesquisa por um candidato, e pode surgir naturalmente durante a sele\u00e7\u00e3o da amostra\u003Csup id=\"fnref:30-1\"\u003E\u003Ca class=\"footnote-ref\" href=\"#fn:30-1\"\u003E1\u003C/a\u003E\u003C/sup\u003E.\u003C/span\u003E\n\u003Cdiv class=\"footnote\"\u003E\n\u003Chr /\u003E\n\u003Col\u003E\n\u003Cli id=\"fn:30-1\"\u003E\u003Cstrong\u003EJota\u003C/strong\u003E. \u003Ca href=\"https://www.jota.info/opiniao-e-analise/colunas/coluna-daniel-marcelino/house-effects-explicam-por-que-pesquisas-eleitorais-sao-tao-diferentes\" rel=\"noopener noreferrer\" target=\"_blank\"\u003E'House effects' explicam por que pesquisas eleitorais s\u00e3o t\u00e3o diferentes\u003C/a\u003E por Daniel Marcelino.\u0026#160;\u003Ca class=\"footnote-backref\" href=\"#fnref:30-1\" title=\"Jump back to footnote 1 in the text\"\u003E\u0026#8617;\u003C/a\u003E\u003C/li\u003E\n\u003C/ol\u003E\n\u003C/div\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "495226043a6accdc43a63d0cd13267b6", "console": [], "id": "ROlb", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch3 id=\"metodologia\"\u003EMetodologia\u003C/h3\u003E\n\u003Cspan class=\"paragraph\"\u003EExiste uma m\u00e9trica popular, usada especificamente para pesquisas eleitorais baseada na raz\u00e3o de chances logar\u00edtmica\u003Csup id=\"fnref:31-2\"\u003E\u003Ca class=\"footnote-ref\" href=\"#fn:31-2\"\u003E1\u003C/a\u003E\u003C/sup\u003E\u003C/span\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||[\nA' = \\ln \\left( \\frac{ \\hat p_A / (1 - \\hat p_A) }{ p_A / (1 - p_A) } \\right) \\tag 1\n||]\u003C/marimo-tex\u003E\u003Cul\u003E\n\u003Cli\u003E\u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\hat p_A||)\u003C/marimo-tex\u003E: Percentual das inten\u00e7\u00f5es de voto ao candidato A estimadas pela pesquisa\u003C/li\u003E\n\u003Cli\u003E\u003Cmarimo-tex class=\"arithmatex\"\u003E||(p_A||)\u003C/marimo-tex\u003E: Percentual dos votos recebidos pelo candidato A na vota\u00e7\u00e3o\u003C/li\u003E\n\u003C/ul\u003E\n\u003Cspan class=\"paragraph\"\u003EO resultado \u003Cmarimo-tex class=\"arithmatex\"\u003E||(A'||)\u003C/marimo-tex\u003E obtido \u00e9 a medida do vi\u00e9s da pesquisa, favor\u00e1vel ao candidato A, se o valor for positivo, o vi\u00e9s \u00e9 favor\u00e1vel \u00e0 este candidato, caso contr\u00e1rio, o vi\u00e9s \u00e9 favor\u00e1vel ao seu advers\u00e1rio, caso \u003Cmarimo-tex class=\"arithmatex\"\u003E||(A' = 0||)\u003C/marimo-tex\u003E, a  pesquisa n\u00e3o apresenta vi\u00e9s.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EMesmo que diferente de zero, valor da m\u00e9trica ainda est\u00e1 sujeito \u00e0 uma margem de erro para avaliar se o vi\u00e9s medido \u00e9 estatisticamente significante, isto exige a medida do erro padr\u00e3o aproximada pelo m\u00e9todo-\u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\delta||)\u003C/marimo-tex\u003E\u003Csup id=\"fnref:31-3\"\u003E\u003Ca class=\"footnote-ref\" href=\"#fn:31-3\"\u003E2\u003C/a\u003E\u003C/sup\u003E:\u003C/span\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||[\nSE(A') = \\sqrt{\\frac{1}{n \\times \\hat p_A \\times (1 - \\hat p_A)}} \\tag 2\n||]\u003C/marimo-tex\u003E\u003Cul\u003E\n\u003Cli\u003E\u003Cmarimo-tex class=\"arithmatex\"\u003E||(n||)\u003C/marimo-tex\u003E: Quantidade de pessoas entrevistadas na pesquisa\u003C/li\u003E\n\u003C/ul\u003E\n\u003Cspan class=\"paragraph\"\u003ECom isso n\u00f3s podemos fazer um intervalo de 95% de confian\u00e7a para o valor real de \u003Cmarimo-tex class=\"arithmatex\"\u003E||(A'||)\u003C/marimo-tex\u003E, se zero estiver dentro do intervalo, n\u00e3o podemos consider\u00e1-lo significativamente diferente de zero.\u003C/span\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||[\nIC(A') = A' \\pm 1,96 \\times SE(A') \\tag 3\n||]\u003C/marimo-tex\u003E\u003Cspan class=\"paragraph\"\u003EPara encontrar a \"taxa de rejei\u00e7\u00e3o real\" removendo o vi\u00e9s da pesquisa, vamos usar \u003Cmarimo-tex class=\"arithmatex\"\u003E||(A'||)\u003C/marimo-tex\u003E para ajustar o peso das respostas entre os votantes de cada candidato, reduzindo para os super representados ou aumentando para os sub representados.\u003C/span\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||[\nP'_A = \\hat p_A \\times e^{-A'} \\tag 4\n||]\u003C/marimo-tex\u003E\u003Cul\u003E\n\u003Cli\u003E\u003Cmarimo-tex class=\"arithmatex\"\u003E||(P'_A||)\u003C/marimo-tex\u003E: Taxa ajustada para o candidato A\u003C/li\u003E\n\u003C/ul\u003E\n\u003Cdiv class=\"footnote\"\u003E\n\u003Chr /\u003E\n\u003Col\u003E\n\u003Cli id=\"fn:31-2\"\u003E\u003Cstrong\u003EPublic Opinion Quarterly\u003C/strong\u003E. \u003Ca href=\"https://doi.org/10.1093/poq/nfi044\" rel=\"noopener noreferrer\" target=\"_blank\"\u003EA Review and Proposal for a New Measure of Poll Accuracy\u003C/a\u003E por Elizabeth A. Martin, Michael W. Traugott e Courtney Kennedy\u0026#160;\u003Ca class=\"footnote-backref\" href=\"#fnref:31-2\" title=\"Jump back to footnote 1 in the text\"\u003E\u0026#8617;\u003C/a\u003E\u003C/li\u003E\n\u003Cli id=\"fn:31-3\"\u003E\u003Cstrong\u003EConstantin Ahlmann-Eltze\u003C/strong\u003E. \u003Ca href=\"https://const-ae.name/post/2023-02-10_delta_method/delta-method-explainer/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003EWhat is the delta method?\u003C/a\u003E\u0026#160;\u003Ca class=\"footnote-backref\" href=\"#fnref:31-3\" title=\"Jump back to footnote 2 in the text\"\u003E\u0026#8617;\u003C/a\u003E\u003C/li\u003E\n\u003C/ol\u003E\n\u003C/div\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "e7a45db2094934a92789486d2c436872", "console": [], "id": "qnkX", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch3 id=\"premissas\"\u003EPremissas\u003C/h3\u003E\n\u003Cspan class=\"paragraph\"\u003EEsta abordagem de an\u00e1lise se apoia em alguns pressupostos, os resultados expostos aqui se tornam inv\u00e1lidos caso ao menos um deles seja falso:\u003C/span\u003E\n\u003Col\u003E\n\u003Cli\u003EO n\u00edvel de rejei\u00e7\u00e3o \u00e9 correlacionado com a inten\u00e7\u00e3o de voto;\u003C/li\u003E\n\u003Cli\u003EA rejei\u00e7\u00e3o aos candidatos n\u00e3o mudou significativamente entre a data da pesquisa e a data da vota\u00e7\u00e3o;\u003C/li\u003E\n\u003Cli\u003EA vota\u00e7\u00e3o registrada nas urnas eletr\u00f4nicas \u00e9 condizente com a realidade.\u003C/li\u003E\n\u003C/ol\u003E\n\u003Cspan class=\"paragraph\"\u003ECom os dados dispon\u00edveis, apenas o primeiro pressuposto pode ser testado, depois que este tenha sido verificado, o leitor basear\u00e1 seu n\u00edvel de confian\u00e7a nos resultados deste estudo na sua cren\u00e7a sobre os outros pressupostos. Para testar a primeira hip\u00f3tese, vamos verificar se existe uma correla\u00e7\u00e3o significativa entre o voto em um candidato, e a rejei\u00e7\u00e3o pelo seu advers\u00e1rio.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EPara fazer esta an\u00e1lise rapidamente, vamos usar os dados de diversas pesquisas eleitorais, comparando as pesquisas de inten\u00e7\u00e3o de voto estimuladas com o percentual de rejei\u00e7\u00e3o, onde o entrevistado responde \"N\u00e3o votaria em ___ de jeito nenhum\".\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "118baa460edef67208c3dd4e9929e862", "console": [], "id": "TqIu", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003E\u003Cbr /\u003E\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "6bb3ca5efba9dde32aa21da7594adbcb", "console": [], "id": "Vxnm", "outputs": [{"data": {"text/html": "\u003Cimg src='data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAv0AAAJgCAYAAAAZPtyJAAAAOnRFWHRTb2Z0d2FyZQBNYXRwbG90bGliIHZlcnNpb24zLjExLjIsIGh0dHBzOi8vbWF0cGxvdGxpYi5vcmcvgI3uAAAAAAlwSFlzAAAPYQAAD2EBqD+naQABAABJREFUeJzs3XdYU+fbB/BvWDJkq2gVF7gHThR3tY7WWRWtu7Z1tWqLtrWKWnfd1l1t vers\u00e1rio com seguran\u00e7a, j\u00e1 que a correla\u00e7\u00e3o com as inten\u00e7\u00f5es de voto ao Lula \u00e9 muito fraca.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "edeb40581bb85b37454b0e53352b6774", "console": [], "id": "ecfG", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"ajustando-as-pesquisas-eleitorais\"\u003EAjustando as pesquisas eleitorais\u003C/h2\u003E\n\u003Cspan class=\"paragraph\"\u003EAs pesquisas eleitorais apontavam um cen\u00e1rio favor\u00e1vel para o candidato Fl\u00e1vio Bolsonaro no segundo turno, agora vamos comparar o resultado previsto pelas pesquisas, o das pesquisas ajustado pela m\u00e9trica \u003Cmarimo-tex class=\"arithmatex\"\u003E||(A'||)\u003C/marimo-tex\u003E de Martin et al. (2005), e comparar com o resultado real das vota\u00e7\u00f5es:\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "fc7b88a99686df3a38e6270ace36dea4", "console": [], "id": "Pvdt", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "522697092e8195540b29064c7009ea9a", "console": [], "id": "ZBYS", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "94bcc4d4f6de352e3f0008f17d382a47", "console": [], "id": "aLJB", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "4c62fd580a455ddd38bbf14749a00c22", "console": [], "id": "nHfw", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ctable\u003E\n\u003Cthead\u003E\n\u003Ctr\u003E\n\u003Cth style=\"text-align: left;\"\u003E\u003C/th\u003E\n\u003Cth style=\"text-align: center;\"\u003EFl\u00e1vio\u003C/th\u003E\n\u003Cth style=\"text-align: center;\"\u003ELula\u003C/th\u003E\n\u003C/tr\u003E\n\u003C/thead\u003E\n\u003Ctbody\u003E\n\u003Ctr\u003E\n\u003Ctd style=\"text-align: left;\"\u003E\u003Cstrong\u003EPesquisas\u003C/strong\u003E\u003C/td\u003E\n\u003Ctd style=\"
